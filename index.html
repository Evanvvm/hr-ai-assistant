    // ==================== 人工会话管理面板 ====================
    function HumanConversationsPanel({ appData, updateAppData, addLog }) {
      const [selectedSession, setSelectedSession] = useState(null);
      const [replyText, setReplyText] = useState('');
      const [filterStatus, setFilterStatus] = useState('all'); // all, pending, replied, closed
      const [filterPosition, setFilterPosition] = useState('all'); // all, 技术岗, 销售岗, etc
      const [searchKeyword, setSearchKeyword] = useState('');
      const [expandedSessions, setExpandedSessions] = useState({});
      const [selectedSessions, setSelectedSessions] = useState([]); // 批量选择

      const sessions = appData.humanSessions || [];

      // 获取所有岗位列表
      const allPositions = [...new Set(sessions.map(s => s.position))];

      // 根据状态、岗位、关键词筛选
      const filteredSessions = sessions.filter(s => {
        // 状态筛选
        if (filterStatus !== 'all' && s.status !== filterStatus) return false;
        // 岗位筛选
        if (filterPosition !== 'all' && s.position !== filterPosition) return false;
        // 关键词搜索
        if (searchKeyword.trim()) {
          const keyword = searchKeyword.toLowerCase();
          const positionMatch = s.position.toLowerCase().includes(keyword);
          const messageMatch = s.messages?.some(m => 
            m.content.toLowerCase().includes(keyword)
          );
          const idMatch = s.id.toLowerCase().includes(keyword);
          if (!positionMatch && !messageMatch && !idMatch) return false;
        }
        return true;
      }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      // 批量选择/取消选择
      const toggleSelectSession = (sessionId) => {
        setSelectedSessions(prev => 
          prev.includes(sessionId) 
            ? prev.filter(id => id !== sessionId)
            : [...prev, sessionId]
        );
      };

      // 全选/取消全选
      const toggleSelectAll = () => {
        if (selectedSessions.length === filteredSessions.length) {
          setSelectedSessions([]);
        } else {
          setSelectedSessions(filteredSessions.map(s => s.id));
        }
      };

      // 批量关闭会话
      const handleBatchClose = () => {
        if (selectedSessions.length === 0) return;
        
        updateAppData(prev => {
          const updatedSessions = prev.humanSessions.map(s => {
            if (selectedSessions.includes(s.id) && s.status !== 'closed') {
              return { ...s, status: 'closed', closed_at: new Date().toLocaleString('zh-CN') };
            }
            return s;
          });
          
          addLog('批量关闭会话', `关闭了 ${selectedSessions.length} 个会话`);
          
          return { ...prev, humanSessions: updatedSessions };
        });

        setSelectedSessions([]);
      };

      // 导出CSV
      const handleExportCSV = () => {
        const dataToExport = filteredSessions.length > 0 ? filteredSessions : sessions;
        
        const csvContent = [
          ['会话ID', '岗位', '状态', '留言数', '回复数', '创建时间', '最后回复时间', '最新消息'].join(','),
          ...dataToExport.map(s => [
            s.id,
            s.position,
            s.status === 'pending' ? '待回复' : s.status === 'replied' ? '已回复' : '已关闭',
            s.messages?.filter(m => m.role === 'user').length || 0,
            s.messages?.filter(m => m.role === 'hr').length || 0,
            s.created_at,
            s.lastMessageTime || '',
            s.lastMessage || ''
          ].map(v => `"${v}"`).join(','))
        ].join('\n');

        const BOM = '\uFEFF';
        const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `人工会话_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        
        addLog('导出人工会话', `导出了 ${dataToExport.length} 条记录`);
      };

      // 切换会话展开/收起
      const toggleExpand = (sessionId) => {
        setExpandedSessions(prev => ({
          ...prev,
          [sessionId]: !prev[sessionId]
        }));
      };

      // 发送回复
      const handleReply = (sessionId) => {
        if (!replyText.trim()) return;
        
        const hrReply = {
          id: Date.now().toString(),
          role: 'hr',
          content: replyText,
          timestamp: new Date().toLocaleString('zh-CN'),
          hrName: 'HR 同事'
        };

        updateAppData(prev => {
          const updatedSessions = prev.humanSessions.map(s => {
            if (s.id === sessionId) {
              return {
                ...s,
                messages: [...(s.messages || []), hrReply],
                status: 'replied',
                replied_at: new Date().toLocaleString('zh-CN'),
                lastMessage: replyText,
                lastMessageTime: new Date().toLocaleString('zh-CN')
              };
            }
            return s;
          });
          
          addLog('回复人工会话', `回复了会话 ${sessionId}`);
          
          return { ...prev, humanSessions: updatedSessions };
        });

        setReplyText('');
      };

      // 关闭会话
      const handleClose = (sessionId) => {
        updateAppData(prev => {
          const updatedSessions = prev.humanSessions.map(s => {
            if (s.id === sessionId) {
              return { ...s, status: 'closed', closed_at: new Date().toLocaleString('zh-CN') };
            }
            return s;
          });
          
          addLog('关闭人工会话', `关闭了会话 ${sessionId}`);
          
          return { ...prev, humanSessions: updatedSessions };
        });

        if (selectedSession?.id === sessionId) {
          setSelectedSession(null);
        }
      };

      // 状态对应的样式
      const getStatusStyle = (status) => {
        switch (status) {
          case 'pending': return { bg: 'bg-amber-100', text: 'text-amber-700', label: '待回复' };
          case 'replied': return { bg: 'bg-green-100', text: 'text-green-700', label: '已回复' };
          case 'closed': return { bg: 'bg-slate-100', text: 'text-slate-600', label: '已关闭' };
          default: return { bg: 'bg-slate-100', text: 'text-slate-600', label: '未知' };
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div>
              <h2 className="text-xl font-semibold text-slate-800">💬 人工会话管理</h2>
              <p className="text-sm text-slate-500">查看并回复候选人的留言</p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              {/* 搜索框 */}
              <input
                type="text"
                value={searchKeyword}
                onChange={(e) => setSearchKeyword(e.target.value)}
                placeholder="搜索关键词..."
                className="px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-40"
              />
              
              {/* 岗位筛选 */}
              <select 
                value={filterPosition} 
                onChange={(e) => setFilterPosition(e.target.value)}
                className="px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="all">全部岗位</option>
                {allPositions.map(pos => (
                  <option key={pos} value={pos}>{pos}</option>
                ))}
              </select>
              
              {/* 状态筛选 */}
              <select 
                value={filterStatus} 
                onChange={(e) => setFilterStatus(e.target.value)}
                className="px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="all">全部状态</option>
                <option value="pending">待回复</option>
                <option value="replied">已回复</option>
                <option value="closed">已关闭</option>
              </select>

              {/* 导出按钮 */}
              <button 
                onClick={handleExportCSV}
                className="px-3 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center gap-1"
              >
                <Icon name="download" className="w-4 h-4" />
                导出CSV
              </button>
            </div>
          </div>

          {/* 批量操作栏 */}
          {selectedSessions.length > 0 && (
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 flex items-center justify-between">
              <span className="text-sm text-blue-700">
                已选择 {selectedSessions.length} 个会话
              </span>
              <div className="flex items-center gap-2">
                <button 
                  onClick={handleBatchClose}
                  className="px-4 py-1.5 bg-red-500 text-white rounded-lg text-sm hover:bg-red-600"
                >
                  批量关闭
                </button>
                <button 
                  onClick={() => setSelectedSessions([])}
                  className="px-4 py-1.5 border border-slate-300 rounded-lg text-sm hover:bg-slate-100"
                >
                  取消选择
                </button>
              </div>
            </div>
          )}

          {/* 统计卡片 */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white rounded-xl p-4 border shadow-sm">
              <p className="text-sm text-slate-500">总会话数</p>
              <p className="text-2xl font-bold text-slate-800">{sessions.length}</p>
            </div>
            <div className="bg-white rounded-xl p-4 border shadow-sm">
              <p className="text-sm text-slate-500">待回复</p>
              <p className="text-2xl font-bold text-amber-600">{sessions.filter(s => s.status === 'pending').length}</p>
            </div>
            <div className="bg-white rounded-xl p-4 border shadow-sm">
              <p className="text-sm text-slate-500">已回复</p>
              <p className="text-2xl font-bold text-green-600">{sessions.filter(s => s.status === 'replied').length}</p>
            </div>
            <div className="bg-white rounded-xl p-4 border shadow-sm">
              <p className="text-sm text-slate-500">已关闭</p>
              <p className="text-2xl font-bold text-slate-400">{sessions.filter(s => s.status === 'closed').length}</p>
            </div>
          </div>

          {/* 会话列表 */}
          <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
            {filteredSessions.length === 0 ? (
              <div className="p-8 text-center">
                <div className="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-4">
                  <Icon name="message" className="w-8 h-8 text-slate-400" />
                </div>
                <p className="text-slate-500">暂无人工会话</p>
              </div>
            ) : (
              <div className="divide-y divide-slate-100">
                {/* 表头 */}
                <div className="bg-slate-50 px-4 py-2 flex items-center gap-3 text-sm font-medium text-slate-600">
                  <input
                    type="checkbox"
                    checked={selectedSessions.length > 0 && selectedSessions.length === filteredSessions.length}
                    onChange={toggleSelectAll}
                    className="w-4 h-4 rounded border-slate-300"
                  />
                  <span className="flex-1">会话信息</span>
                  <span className="w-24 text-center">状态</span>
                  <span className="w-32 text-center">消息数</span>
                  <span className="w-24 text-center">操作</span>
                </div>
                
                {filteredSessions.map(session => {
                  const statusStyle = getStatusStyle(session.status);
                  const isExpanded = expandedSessions[session.id];
                  const userMessages = session.messages?.filter(m => m.role === 'user') || [];
                  const hrReplies = session.messages?.filter(m => m.role === 'hr') || [];

                  return (
                    <div key={session.id} className="p-4 hover:bg-slate-50 transition-colors">
                      {/* 会话头部 */}
                      <div className="flex items-start justify-between">
                        <div className="flex items-start gap-3 flex-1">
                          {/* 复选框 */}
                          <input
                            type="checkbox"
                            checked={selectedSessions.includes(session.id)}
                            onChange={() => toggleSelectSession(session.id)}
                            className="w-4 h-4 mt-1 rounded border-slate-300"
                          />
                          
                          <div className="flex-1">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="font-medium text-slate-800">{session.position}</span>
                              <span className={`px-2 py-0.5 rounded text-xs font-medium ${statusStyle.bg} ${statusStyle.text}`}>
                                {statusStyle.label}
                              </span>
                            </div>
                            <p className="text-xs text-slate-400 font-mono">{session.id}</p>
                            <p className="text-xs text-slate-400 mt-1">
                              创建于 {session.created_at}
                              {session.replied_at && <span> · 回复于 {session.replied_at}</span>}
                            </p>
                          </div>
                        </div>
                        
                        {/* 消息数 */}
                        <div className="w-32 text-center">
                          <p className="text-sm text-slate-600">{userMessages.length} 条留言</p>
                          <p className="text-xs text-slate-400">{hrReplies.length} 条回复</p>
                        </div>
                        
                        {/* 操作按钮 */}
                        <div className="flex items-center gap-2 w-24 justify-end">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="font-medium text-slate-800">{session.position}</span>
                            <span className={`px-2 py-0.5 rounded text-xs font-medium ${statusStyle.bg} ${statusStyle.text}`}>
                              {statusStyle.label}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400 font-mono">{session.id}</p>
                          <p className="text-sm text-slate-500 mt-1">
                            {userMessages.length} 条留言 / {hrReplies.length} 条回复
                          </p>
                          <p className="text-xs text-slate-400 mt-1">
                            创建于 {session.created_at}
                            {session.replied_at && <span> · 回复于 {session.replied_at}</span>}
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button 
                            onClick={() => toggleExpand(session.id)}
                            className="px-3 py-1 text-sm border rounded-lg hover:bg-slate-100 transition-colors"
                          >
                            {isExpanded ? '收起' : '查看详情'}
                          </button>
                          {session.status !== 'closed' && (
                            <button 
                              onClick={() => handleClose(session.id)}
                              className="px-3 py-1 text-sm text-red-600 border border-red-200 rounded-lg hover:bg-red-50 transition-colors"
                            >
                              关闭会话
                            </button>
                          )}
                        </div>
                      </div>

                      {/* 展开的会话详情 */}
                      {isExpanded && (
                        <div className="mt-4 p-4 bg-slate-50 rounded-lg">
                          <div className="space-y-3 max-h-64 overflow-y-auto">
                            {/* 问题-答案交替显示 */}
                            {(() => {
                              // 将所有消息按时间排序，然后交替显示
                              const allMessages = [...(session.messages || [])].sort((a, b) => 
                                new Date(a.timestamp) - new Date(b.timestamp)
                              );
                              let qIndex = 0;
                              let aIndex = 0;
                              const items = [];
                              
                              for (let i = 0; i < allMessages.length; i++) {
                                const msg = allMessages[i];
                                if (msg.role === 'user') {
                                  items.push(
                                    <div key={msg.id || `q-${qIndex}`} className="flex gap-3">
                                      <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
                                        <Icon name="user" className="w-4 h-4 text-blue-600" />
                                      </div>
                                      <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-1">
                                          <span className="text-sm font-medium text-slate-700">候选人</span>
                                          <span className="text-xs text-slate-400">{msg.timestamp}</span>
                                        </div>
                                        <div className="bg-white rounded-lg rounded-tl-sm px-3 py-2 border">
                                          <p className="text-sm text-slate-600 whitespace-pre-wrap">{msg.content}</p>
                                        </div>
                                      </div>
                                    </div>
                                  );
                                  qIndex++;
                                } else {
                                  items.push(
                                    <div key={msg.id || `a-${aIndex}`} className="flex gap-3">
                                      <div className="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
                                        <Icon name="user" className="w-4 h-4 text-green-600" />
                                      </div>
                                      <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-1">
                                          <span className="text-sm font-medium text-green-700">HR 同事</span>
                                          <span className="text-xs text-slate-400">{msg.timestamp}</span>
                                        </div>
                                        <div className="bg-green-50 rounded-lg rounded-tl-sm px-3 py-2 border border-green-200">
                                          <p className="text-sm text-slate-700 whitespace-pre-wrap">{msg.content}</p>
                                        </div>
                                      </div>
                                    </div>
                                  );
                                  aIndex++;
                                }
                              }
                              return items;
                            })()}
                          </div>

                          {/* 回复输入框 */}
                          {session.status !== 'closed' && (
                            <div className="mt-4 flex gap-2">
                              <textarea
                                value={selectedSession?.id === session.id ? replyText : ''}
                                onChange={(e) => {
                                  setSelectedSession(session);
                                  setReplyText(e.target.value);
                                }}
                                placeholder="输入回复内容..."
                                className="flex-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                                rows={2}
                              />
                              <button 
                                onClick={() => handleReply(session.id)}
                                disabled={!replyText.trim() || selectedSession?.id !== session.id}
                                className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                              >
                                发送回复
                              </button>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ReviewQueuePanel({ appData, updateAppData, addLog, setAdminSection }) {
      const [selectedIds, setSelectedIds] = useState([]);
      const [showAddModal, setShowAddModal] = useState(null);
      const [filterLevel, setFilterLevel] = useState('all'); // all, urgent, high, medium, low

      // 人工必要性等级对应的样式
      const getLevelStyle = (level) => {
        switch (level) {
          case 'urgent': return { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-300', label: '紧急', icon: '🚨' };
          case 'high': return { bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-300', label: '高', icon: '⚠️' };
          case 'medium': return { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-300', label: '中', icon: '⚡' };
          default: return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-300', label: '低', icon: '📋' };
        }
      };

      // 意图类别样式
      const getIntentStyle = (category) => {
        switch (category) {
          case 'sensitive': return { bg: 'bg-purple-50', text: 'text-purple-700', label: '敏感信息' };
          case 'legal': return { bg: 'bg-rose-50', text: 'text-rose-700', label: '法律合规' };
          case 'personal': return { bg: 'bg-cyan-50', text: 'text-cyan-700', label: '个人情况' };
          case 'complaint': return { bg: 'bg-orange-50', text: 'text-orange-700', label: '投诉建议' };
          default: return { bg: 'bg-slate-100', text: 'text-slate-700', label: '一般咨询' };
        }
      };

      // 过滤审核队列
      const filteredQueue = filterLevel === 'all' 
        ? appData.reviewQueue 
        : appData.reviewQueue.filter(item => item.humanNecessityLevel === filterLevel);

      // 按紧急程度排序
      const sortedQueue = [...filteredQueue].sort((a, b) => {
        const priority = { urgent: 0, high: 1, medium: 2, low: 3 };
        return (priority[a.humanNecessityLevel] || 3) - (priority[b.humanNecessityLevel] || 3);
      });

      const handleApprove = (id) => {
        updateAppData(prev => ({ ...prev, reviewQueue: prev.reviewQueue.filter(r => r.id !== id) }));
        addLog('审核通过', `审核了 ${id}`);
      };

      const handleIgnore = (id) => {
        updateAppData(prev => ({ ...prev, reviewQueue: prev.reviewQueue.filter(r => r.id !== id) }));
        addLog('忽略问题', `忽略了 ${id}`);
      };

      const handleBatchApprove = () => {
        updateAppData(prev => ({ ...prev, reviewQueue: prev.reviewQueue.filter(r => !selectedIds.includes(r.id)) }));
        addLog('批量审核', `批量审核了 ${selectedIds.length} 条`);
        setSelectedIds([]);
      };

      const toggleSelect = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const handleAddToKnowledge = (item) => {
        // 生成KB格式的新ID
        const existingIds = appData.knowledgeBase.map(kb => parseInt(kb.id.replace('KB-', '')) || 0);
        const maxId = existingIds.length > 0 ? Math.max(...existingIds) : 0;
        const newKbId = 'KB-' + String(maxId + 1).padStart(3, '0');
        
        // 创建知识库条目，保留审核队列的问题作为问题变体
        const newKbItem = {
          id: newKbId,
          category: item.category || '未分类',
          applicable_positions: item.applicable_positions || ['all'],
          question_variants: item.question_variants || [item.question],
          standard_answer: item.standard_answer || '',
          sensitivity_level: item.sensitivity_level || 'low'
        };
        
        updateAppData(prev => ({ 
          ...prev, 
          knowledgeBase: [...prev.knowledgeBase, newKbItem], 
          reviewQueue: prev.reviewQueue.filter(r => r.id !== item.id) 
        }));
        addLog('添加到知识库', `从审核队列添加了 ${newKbId}`);
        setShowAddModal(null);
        if (setAdminSection) setAdminSection('knowledge');
      };

      // 统计各等级数量
      const levelCounts = {
        urgent: appData.reviewQueue.filter(r => r.humanNecessityLevel === 'urgent').length,
        high: appData.reviewQueue.filter(r => r.humanNecessityLevel === 'high').length,
        medium: appData.reviewQueue.filter(r => r.humanNecessityLevel === 'medium').length,
        low: appData.reviewQueue.filter(r => r.humanNecessityLevel === 'low').length
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div>
              <h2 className="text-lg font-semibold text-slate-800">审核队列</h2>
              <p className="text-sm text-slate-500">
                待审核问题（{appData.reviewQueue.length} 条）
                {levelCounts.urgent > 0 && <span className="ml-2 text-red-600 font-medium">🚨 紧急 {levelCounts.urgent}</span>}
              </p>
            </div>
            <div className="flex items-center gap-3">
              {/* 等级筛选 */}
              <div className="flex items-center gap-1 bg-white rounded-lg p-1 border">
                {['all', 'urgent', 'high', 'medium', 'low'].map(level => (
                  <button
                    key={level}
                    onClick={() => setFilterLevel(level)}
                    className={`px-2 py-1 text-xs rounded-md transition-all ${
                      filterLevel === level 
                        ? level === 'urgent' ? 'bg-red-500 text-white' 
                        : level === 'high' ? 'bg-amber-500 text-white'
                        : level === 'medium' ? 'bg-blue-500 text-white'
                        : level === 'low' ? 'bg-green-500 text-white'
                        : 'bg-slate-500 text-white'
                        : 'hover:bg-slate-100 text-slate-600'
                    }`}
                  >
                    {level === 'all' ? '全部' : level === 'urgent' ? '🚨紧急' : level === 'high' ? '⚠️高' : level === 'medium' ? '⚡中' : '📋低'}
                    {level !== 'all' && levelCounts[level] > 0 && `(${levelCounts[level]})`}
                  </button>
                ))}
              </div>
              {selectedIds.length > 0 && (
                <button onClick={handleBatchApprove} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                  批量通过 ({selectedIds.length})
                </button>
              )}
            </div>
          </div>

          {sortedQueue.length === 0 ? (
            <div className="bg-white rounded-xl shadow-sm border p-12 text-center text-slate-500">
              <Icon name="check" className="w-12 h-12 mx-auto mb-4 text-green-400" />
              <p>{filterLevel === 'all' ? '暂无待审核问题' : `暂无${filterLevel === 'urgent' ? '紧急' : filterLevel === 'high' ? '高' : filterLevel === 'medium' ? '中等' : '低'}优先级问题`}</p>
            </div>
          ) : (
            <div className="space-y-3">
              {sortedQueue.map(item => {
                const levelStyle = getLevelStyle(item.humanNecessityLevel);
                const intentStyle = getIntentStyle(item.intentCategory);
                return (
                  <div key={item.id} className={`bg-white rounded-xl shadow-sm border p-4 ${levelStyle.border} border-l-4`}>
                    <div className="flex items-start justify-between mb-3">
                      <div className="flex-1">
                        <div className="flex items-center gap-2 mb-2 flex-wrap">
                          <input type="checkbox" checked={selectedIds.includes(item.id)} onChange={() => toggleSelect(item.id)} className="w-4 h-4 rounded" />
                          <span className="text-xs font-mono text-slate-500">{item.id}</span>
                          <span className="px-2 py-0.5 bg-slate-100 rounded text-xs">{item.position}</span>
                          {/* 人工必要性评分 */}
                          <span className={`px-2 py-0.5 ${levelStyle.bg} ${levelStyle.text} rounded text-xs font-medium`}>
                            {levelStyle.icon} 人工必要性: {levelStyle.label} ({item.humanNecessityScore}分)
                          </span>
                          {/* 意图类别 */}
                          <span className={`px-2 py-0.5 ${intentStyle.bg} ${intentStyle.text} rounded text-xs`}>
                            {intentStyle.label}
                          </span>
                          {/* AI置信度 */}
                          <span className="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs">AI置信度 {item.confidence}%</span>
                          {/* 情绪标签 */}
                          {item.emotions?.negative && <span className="px-2 py-0.5 bg-red-50 text-red-600 rounded text-xs">😠 负面情绪</span>}
                          {item.emotions?.urgent && <span className="px-2 py-0.5 bg-orange-50 text-orange-600 rounded text-xs">⏰ 紧急</span>}
                        </div>
                        <h4 className="font-medium text-slate-800 text-lg">"{item.question}"</h4>
                        {item.context && item.context !== '用户提问' && (
                          <p className="text-sm text-slate-500 mt-1">问题分析：{item.context}</p>
                        )}
                        {item.suggestion && (
                          <p className="text-sm text-blue-600 mt-1 flex items-center gap-1">
                            <Icon name="alert" className="w-3 h-3" />
                            {item.suggestion}
                          </p>
                        )}
                      </div>
                      <span className="text-xs text-slate-500 whitespace-nowrap ml-4">{item.created_at}</span>
                    </div>
                    <div className="flex items-center gap-2 flex-wrap pt-2 border-t">
                      <button onClick={() => handleApprove(item.id)} className="px-3 py-1.5 bg-green-500 text-white rounded-lg hover:bg-green-600 text-sm flex items-center gap-1">
                        <Icon name="check" className="w-4 h-4" /> 标记已处理
                      </button>
                      <button onClick={() => setShowAddModal(item)} className="px-3 py-1.5 border border-blue-500 text-blue-500 rounded-lg hover:bg-blue-50 text-sm flex items-center gap-1">
                        <Icon name="plus" className="w-4 h-4" /> 添加到知识库
                      </button>
                      <button onClick={() => handleIgnore(item.id)} className="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 text-sm">忽略</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {showAddModal && <AddKnowledgeModal onClose={() => setShowAddModal(null)} appData={appData} onAdd={handleAddToKnowledge} initialQuestion={showAddModal.question} />}
        </div>
      );
    }

    function OperationLogsPanel({ appData }) {
      const exportLogs = () => {
        const headers = ['时间', '操作类型', '详情', '操作人'];
        const rows = appData.operationLogs.map(log => [log.time, log.type, log.detail, log.operator]);
        const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `操作日志_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-lg font-semibold text-slate-800">操作日志</h2>
              <p className="text-sm text-slate-500">管理员操作记录（{appData.operationLogs.length} 条）</p>
            </div>
            {appData.operationLogs.length > 0 && (
              <button onClick={exportLogs} className="px-4 py-2 border rounded-lg hover:bg-slate-50 text-sm flex items-center gap-2">

                    <th className="text-left px-4 py-3 text-sm font-medium text-slate-600">时间</th>

    // ==================== 通知设置面板 ====================
    function NotificationPanel({ addLog }) {
      const [config, setConfig] = useState(loadNotificationConfig);
      const [showTestResult, setShowTestResult] = useState(null);
      const [saving, setSaving] = useState(false);

      // 保存配置
      const handleSave = () => {
        setSaving(true);
        saveNotificationConfig(config);
        addLog('通知设置', `更新了通知配置：${config.channels.length}个渠道`);
        setTimeout(() => {
          setSaving(false);
        }, 500);
      };

      // 切换渠道启用状态
      const toggleChannel = (channelId) => {
        setConfig(prev => ({
          ...prev,
          channels: prev.channels.includes(channelId)
            ? prev.channels.filter(c => c !== channelId)
            : [...prev.channels, channelId]
        }));
      };

      // 切换规则启用状态
      const toggleRule = (ruleId) => {
        setConfig(prev => ({
          ...prev,
          rules: prev.rules.includes(ruleId)
            ? prev.rules.filter(r => r !== ruleId)
            : [...prev.rules, ruleId]
        }));
      };

      // 测试通知发送
      const handleTestNotification = async () => {
        if (config.channels.length === 0) {
          setShowTestResult({ type: 'error', message: '请先选择至少一个通知渠道' });
          return;
        }
        
        const testItem = {
          id: 'TEST-' + Date.now(),
          question: '【测试消息】这是一条测试通知，确认是否收到',
          position: '技术岗',
          context: '系统功能测试',
          humanNecessityScore: 85,
          humanNecessityLevel: 'urgent',
          intentCategory: 'personal',
          emotions: { negative: false, urgent: true },
          suggestion: '请确认是否收到此测试消息',
          created_at: new Date().toLocaleString('zh-CN')
        };
        
        const results = await sendNotification(config, testItem);
        setShowTestResult({ type: 'success', results });
        addLog('通知测试', `发送测试通知到 ${config.channels.length} 个渠道`);
      };

      // 获取渠道图标
      const getChannelIcon = (iconName) => {
        const icons = {
          wechat: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.045c.134 0 .24-.11.24-.245 0-.06-.024-.12-.04-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.269-.03-.406-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>,
          dingtalk: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>,
          feishu: <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>,
          email: <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
          webhook: <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>

      return (

                <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${config.enabled ? 'bg-green-100' : 'bg-slate-100'}`}>

              </button>
            </div>
          </div>

          {/* 通知渠道 */}
          <div className="bg-white rounded-xl shadow-sm border p-6">
            <h3 className="font-medium text-slate-800 mb-4">通知渠道</h3>
            <p className="text-sm text-slate-500 mb-4">选择需要推送通知的办公软件，选中后填写对应 Webhook 地址即可接收真实通知（可多选）</p>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {NOTIFICATION_CHANNELS.map(channel => (
                <div
                  key={channel.id}
                  onClick={() => toggleChannel(channel.id)}
                  className={`p-4 rounded-xl border-2 cursor-pointer transition-all ${
                    config.channels.includes(channel.id)
                      ? 'border-blue-500 bg-blue-50'
                      : 'border-slate-200 hover:border-slate-300'

                >
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${
                        channel.id === 'wechat' ? 'bg-green-100 text-green-600' :
                        channel.id === 'dingtalk' ? 'bg-blue-100 text-blue-600' :
                        channel.id === 'feishu' ? 'bg-cyan-100 text-cyan-600' :
                        channel.id === 'email' ? 'bg-slate-100 text-slate-600' :

                        {getChannelIcon(channel.icon)}
                      </div>
                      <span className="font-medium text-slate-800">{channel.name}</span>
                    </div>
                    <div className={`w-5 h-5 rounded border-2 flex items-center justify-center ${
                      config.channels.includes(channel.id)

                    }`}>
                      {config.channels.includes(channel.id) && (
                        <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />

                </div>

            </div>
            
            {/* 企业微信 Webhook 配置 */}
            {config.channels.includes('wechat') && (
              <div className="mt-4 pt-4 border-t" onClick={e => e.stopPropagation()}>
                <label className="block text-sm font-medium text-slate-700 mb-2">企业微信机器人 Webhook URL</label>
                <input

            {/* 钉钉 Webhook 配置 */}

                <label className="block text-sm font-medium text-slate-700 mb-2">钉钉机器人 Webhook URL</label>
                <input
                  type="url"
                  value={config.dingtalkWebhookUrl || ''}
                  onChange={(e) => setConfig(prev => ({ ...prev, dingtalkWebhookUrl: e.target.value }))}
                  placeholder="https://oapi.dingtalk.com/robot/send?access_token=xxx"

                />

              </div>
            )}
            
            {/* 飞书 Webhook 配置 */}
            {config.channels.includes('feishu') && (
              <div className="mt-4 pt-4 border-t" onClick={e => e.stopPropagation()}>
                <label className="block text-sm font-medium text-slate-700 mb-2">飞书机器人 Webhook URL</label>
                <input
                  type="url"
                  value={config.feishuWebhookUrl || ''}
                  onChange={(e) => setConfig(prev => ({ ...prev, feishuWebhookUrl: e.target.value }))}
                  placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/xxx"
                  className="w-full px-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <p className="text-xs text-slate-500 mt-1">在飞书群添加自定义机器人，复制其 Webhook 地址填入此处</p>
              </div>
            )}
            
            {/* Webhook URL 配置 */}
            {config.channels.includes('webhook') && (
              <div className="mt-4 pt-4 border-t" onClick={e => e.stopPropagation()}>
                <label className="block text-sm font-medium text-slate-700 mb-2">自定义 Webhook URL</label>
                <input
                  type="url"
                  value={config.webhookUrl || ''}
                  onChange={(e) => setConfig(prev => ({ ...prev, webhookUrl: e.target.value }))}
                  placeholder="https://your-webhook-url.com/notify"
                  className="w-full px-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <p className="text-xs text-slate-500 mt-1">填写后系统将以 JSON 格式 POST 发送，包含问题、岗位、优先级等完整字段</p>
              </div>
            )}
            
            {/* 邮箱配置 */}
            {config.channels.includes('email') && (
              <div className="mt-4 pt-4 border-t" onClick={e => e.stopPropagation()}>
                <label className="block text-sm font-medium text-slate-700 mb-2">收件 HR 邮箱</label>
                <input
                  type="email"
                  value={config.emailAddress || ''}
                  onChange={(e) => setConfig(prev => ({ ...prev, emailAddress: e.target.value }))}
                  placeholder="hr@company.com"

                />
                <div className="bg-blue-50 rounded-lg p-3 mt-3 text-xs text-blue-700">
                  <p className="font-medium mb-1">📬 如何激活邮件通知</p>
                  <p>填写邮箱后点「测试通知」，系统将向该邮箱发送第一封邮件。</p>
                  <p className="mt-1">📌 收件人会收到一封来自 Formsubmit 的<strong>激活确认邮件</strong>，点击其中链接后，后续通知将<strong>自动直达收件箱</strong>，无需任何其他配置。</p>
                </div>
              </div>
            )}
          </div>

          {/* 触发规则 */}
          <div className="bg-white rounded-xl shadow-sm border p-6">
            <h3 className="font-medium text-slate-800 mb-4">触发规则</h3>
            <p className="text-sm text-slate-500 mb-4">选择需要触发通知的问题类型</p>
            <div className="space-y-3">
              {NOTIFICATION_RULES.map(rule => (
                <label key={rule.id} className="flex items-center gap-3 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={config.rules.includes(rule.id)}
                    onChange={() => toggleRule(rule.id)}

                  />
                  <div className="flex-1">
                    <span className={`font-medium ${

                      rule.id === 'sensitive' ? 'text-purple-600' :

                    <span className="text-sm text-slate-500 ml-2">{rule.description}</span>

                  <span className="font-medium text-slate-700">知识库无匹配</span>
                  <span className="text-sm text-slate-500 ml-2">AI 无法解答时自动通知</span>
                </div>
              </label>
            </div>
          </div>

          {/* 通知历史提示 */}

          </div>

          {showTestResult && (

              showTestResult.type === 'success' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'

                </div>

              {showTestResult.message && (
                <p className="text-sm text-red-600 ml-7">{showTestResult.message}</p>
              )}
            </div>
          )}
        </div>
      );
    }

    function SettingsPanel({ appData, updateAppData, addLog }) {
      // 从 appData 中读取设置，若无则使用默认值
      const [settings, setSettings] = useState(() => appData.settings || { confidenceThreshold: 70, autoHandoff: true });

      const exportData = (type) => {
        let headers, rows, filename;
        if (type === 'conversations') {
          headers = ['时间', 'AI解决', '置信度', '类别', '满意度'];
          rows = appData.conversations.map(c => [c.time, c.aiResolved ? '是' : '否', c.confidence + '%', c.category, c.satisfaction || '未评价']);
          filename = '对话记录';
        } else if (type === 'knowledge') {
          headers = ['ID', '分类', '问题', '敏感级别'];
          rows = appData.knowledgeBase.map(k => [k.id, k.category, k.question_variants[0], k.sensitivity_level]);
          filename = '知识库';
        }

        const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${filename}_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        addLog('导出数据', `导出了 ${type}`);
      };

      const resetData = () => {
        if (confirm('确定重置所有数据？这将清除对话、审核队列和统计信息。')) {
          updateAppData(defaultData);
          addLog('重置数据', '重置了所有数据');
        }
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-lg font-semibold text-slate-800">系统设置</h2>
            <p className="text-sm text-slate-500">配置 AI 引擎和人机协作规则</p>
          </div>

          <div className="bg-white rounded-xl shadow-sm border p-6 space-y-6">
            <div>
              <div className="flex items-center justify-between mb-2">
                <label className="text-sm font-medium text-slate-700">置信度阈值</label>
                <span className="text-sm text-blue-600 font-medium">{settings.confidenceThreshold}%</span>
              </div>
              <input type="range" min="50" max="95" value={settings.confidenceThreshold} onChange={(e) => {
                const newSettings = { ...settings, confidenceThreshold: Number(e.target.value) };
                setSettings(newSettings);
                updateAppData(prev => ({ ...prev, settings: newSettings }));
              }} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500" />
              <p className="text-xs text-slate-500 mt-1">低于此阈值的问题将进入审核队列</p>
            </div>

            <div className="flex items-center justify-between">
              <div>
                <label className="text-sm font-medium text-slate-700">自动转人工</label>
                <p className="text-xs text-slate-500">用户输入关键词时自动转接人工</p>
              </div>
              <button onClick={() => setSettings({ ...settings, autoHandoff: !settings.autoHandoff })} className={`w-12 h-6 rounded-full transition-colors ${settings.autoHandoff ? 'bg-blue-500' : 'bg-slate-300'}`}>
                <div className={`w-5 h-5 bg-white rounded-full shadow transition-transform ${settings.autoHandoff ? 'translate-x-6' : 'translate-x-0.5'}`} />
              </button>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border p-6 space-y-4">
            <h3 className="font-medium text-slate-700">数据管理</h3>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => exportData('conversations')} className="px-4 py-2 border rounded-lg hover:bg-slate-50 text-sm flex items-center gap-2">
                <Icon name="export" className="w-4 h-4" /> 导出对话记录
              </button>
              <button onClick={() => exportData('knowledge')} className="px-4 py-2 border rounded-lg hover:bg-slate-50 text-sm flex items-center gap-2">
                <Icon name="export" className="w-4 h-4" /> 导出知识库
              </button>
              <button onClick={resetData} className="px-4 py-2 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 text-sm">
                重置所有数据
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== 效果看板 ====================
    function Dashboard({ appData }) {
      const [timeRange, setTimeRange] = useState('7d');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const conversations = appData.conversations || [];
      const days = timeRange === '7d' ? 7 : timeRange === '14d' ? 14 : 30;

      // 计算近N天每日指标（从真实对话数据）
      const getDailyMetrics = () => {
        const today = new Date();
        const metricsMap = {};
        for (let i = days - 1; i >= 0; i--) {
          const d = new Date(today);
          d.setDate(d.getDate() - i);
          // 统一使用 yyyy-MM-dd 格式作为 key
          const key = d.toISOString().split('T')[0];
          metricsMap[key] = { date: key, total_conversations: 0, ai_resolved: 0, satisfaction_score: 0, satisfaction_count: 0 };
        }
        conversations.forEach(conv => {
          // 解析 toLocaleString 格式的时间（如 "2026/3/29 14:30:25"）
          // 转换为标准格式进行匹配
          if (conv.time) {
            const parts = conv.time.split(' ')[0].split('/');
            if (parts.length === 3) {
              const [year, month, day] = parts;
              // 转换为 yyyy-MM-dd 格式
              const key = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
              if (metricsMap[key]) {
                metricsMap[key].total_conversations++;
                if (conv.aiResolved) metricsMap[key].ai_resolved++;
                if (conv.satisfaction) {
                  metricsMap[key].satisfaction_score += conv.satisfaction === '满意' ? 5 : conv.satisfaction === '一般' ? 3 : 1;
                  metricsMap[key].satisfaction_count++;
                }
              }
            }
          }
        });
        return Object.values(metricsMap).map(m => ({
          ...m,
          ai_resolution_rate: m.total_conversations > 0 ? parseFloat((m.ai_resolved / m.total_conversations * 100).toFixed(1)) : 0,
          satisfaction_score: m.satisfaction_count > 0 ? parseFloat((m.satisfaction_score / m.satisfaction_count).toFixed(2)) : 0
        }));
      };

      const recentMetrics = getDailyMetrics();
      const hasData = conversations.length > 0;

      // KPI 计算
      const avgAiRate = appData.stats.totalConversations > 0
        ? parseFloat((appData.stats.aiResolved / appData.stats.totalConversations * 100).toFixed(1))
        : 0;
      const avgSatisfaction = appData.stats.satisfactionCount > 0
        ? (appData.stats.totalSatisfaction / appData.stats.satisfactionCount).toFixed(1)
        : '—';
      const hrSavedTime = (appData.stats.aiResolved * 5) + (appData.stats.humanHandled * 2);
      // 人均答疑时间 = 实际员工答疑总时长 / 答疑人数（分钟）
      const avgAnswerTime = appData.stats.humanHandled > 0
        ? parseFloat((appData.stats.totalHumanAnswerTime / appData.stats.humanHandled).toFixed(1))
        : 0;

      // 问题类型分布（从真实数据计算）
      const categoryMap = {};
      conversations.forEach(conv => {
        const cat = conv.category || '未分类';
        categoryMap[cat] = (categoryMap[cat] || 0) + 1;
      });
      const typeData = Object.entries(categoryMap)
        .map(([type, count]) => ({ type, count }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 6);
      const typeTotal = typeData.reduce((sum, d) => sum + d.count, 0);

      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.destroy();
          chartInstance.current = null;
        }
        if (!chartRef.current) return;

        const ctx = chartRef.current.getContext('2d');
        if (!ctx) return;

        const labels = recentMetrics.map(d => d.date.slice(5));
        const aiRateData = recentMetrics.map(d => d.ai_resolution_rate);
        const satData = recentMetrics.map(d => d.satisfaction_score * 20);

        chartInstance.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: 'AI解决率(%)', data: aiRateData, borderColor: '#0052D9', backgroundColor: 'rgba(0,82,217,0.1)', fill: true, tension: 0.4 },
              { label: '满意度(×20)', data: satData, borderColor: '#10B981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'top' } },
            scales: { y: { beginAtZero: true, max: 100 } }
          }
        });
      }, [timeRange, appData.conversations]);

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div>
              <h2 className="text-lg font-semibold text-slate-800">效果看板</h2>
              <p className="text-sm text-slate-500">{hasData ? `共 ${conversations.length} 条对话记录` : '暂无对话数据，开始对话后数据将自动更新'}</p>
            </div>
            <div className="flex items-center gap-2 bg-white rounded-lg p-1 border">
              {[{ id: '7d', label: '近7天' }, { id: '14d', label: '近14天' }, { id: '30d', label: '近30天' }].map(range => (
                <button key={range.id} onClick={() => setTimeRange(range.id)} className={`px-3 py-1.5 text-sm rounded-md transition-all ${timeRange === range.id ? 'bg-blue-500 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                  {range.label}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {[
              { label: 'AI解决率', value: avgAiRate > 0 ? avgAiRate + '%' : '—', target: '80%', icon: 'bot', color: 'blue' },
              { label: '人均答疑时间', value: hasData ? `${avgAnswerTime}分钟` : '—', target: '≤3分钟', icon: 'activity', color: 'green' },
              { label: '总对话数', value: appData.stats.totalConversations || 0, target: '累计', icon: 'message', color: 'amber' },
              { label: '候选人满意度', value: avgSatisfaction, target: '≥4.2分', icon: 'star', color: 'rose' }
            ].map((kpi, idx) => (
              <div key={idx} className="bg-white rounded-xl shadow-sm border p-4">
                <div className="flex items-center justify-between mb-3">
                  <div className={`w-10 h-10 rounded-lg bg-${kpi.color}-100 flex items-center justify-center`}>
                    <Icon name={kpi.icon} className={`w-5 h-5 text-${kpi.color}-600`} />
                  </div>
                  <span className="text-xs px-2 py-0.5 bg-slate-100 rounded-full">{kpi.target}</span>
                </div>
                <p className="text-2xl font-bold text-slate-800">{kpi.value}</p>
                <p className="text-sm text-slate-500">{kpi.label}</p>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl shadow-sm border p-4">
              <h3 className="font-semibold text-slate-800 mb-4">AI解决率 & 满意度趋势</h3>
              {hasData ? (
                <div className="h-64"><canvas ref={chartRef}></canvas></div>
              ) : (
                <div className="h-64 flex flex-col items-center justify-center text-slate-400">
                  <Icon name="chart" className="w-12 h-12 mb-2 opacity-30" />
                  <p className="text-sm">暂无数据，开始对话后自动生成</p>
                </div>
              )}
            </div>

            <div className="bg-white rounded-xl shadow-sm border p-4">
              <h3 className="font-semibold text-slate-800 mb-4">问题类型分布</h3>
              {typeData.length > 0 ? (
                <div className="space-y-3">
                  {typeData.map((item, idx) => (
                    <div key={idx} className="flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-3 h-3 rounded-full" style={{ backgroundColor: ['#0052D9', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981', '#06B6D4'][idx] }}></div>
                        <span className="text-sm text-slate-700">{item.type}</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <div className="w-32 h-2 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full rounded-full" style={{ width: (item.count / typeTotal * 100) + '%', backgroundColor: ['#0052D9', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981', '#06B6D4'][idx] }}></div>
                        </div>
                        <span className="text-sm font-medium text-slate-800 w-12 text-right">{item.count}</span>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="h-48 flex flex-col items-center justify-center text-slate-400">
                  <Icon name="database" className="w-10 h-10 mb-2 opacity-30" />
                  <p className="text-sm">暂无数据</p>
                </div>
              )}
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border p-4">
            <h3 className="font-semibold text-slate-800 mb-4">实时会话统计</h3>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="text-center p-4 bg-slate-50 rounded-lg">
                <p className="text-2xl font-bold text-blue-600">{appData.stats.totalConversations}</p>
                <p className="text-sm text-slate-500">总对话数</p>
              </div>
              <div className="text-center p-4 bg-slate-50 rounded-lg">
                <p className="text-2xl font-bold text-green-600">{appData.stats.aiResolved}</p>
                <p className="text-sm text-slate-500">AI解决数</p>
              </div>
              <div className="text-center p-4 bg-slate-50 rounded-lg">
                <p className="text-2xl font-bold text-amber-600">{appData.stats.humanHandled}</p>
                <p className="text-sm text-slate-500">人工处理数</p>
              </div>
              <div className="text-center p-4 bg-slate-50 rounded-lg">
                <p className="text-2xl font-bold text-red-600">{appData.stats.sensitiveBlocked}</p>
                <p className="text-sm text-slate-500">敏感拦截数</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 渲染应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
