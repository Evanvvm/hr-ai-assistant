  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // ==================== 数据层 ====================
    const knowledgeBase = [
      { id: 'KB-001', category: '面试流程', applicable_positions: ['all'], question_variants: ['面试有几轮', '面试流程是什么', '面试需要多久', '面试安排'], standard_answer: '我们公司招聘流程分为 **3 轮面试**：\n\n1. **HR 初筛**（30 分钟）- 了解您的背景和求职意向\n2. **专业面试**（1 小时）- 部门负责人考察专业能力\n3. **高管终面**（30 分钟）- 了解文化匹配度和成长潜力\n\n整体流程预计 1-2 周，具体时间可能因岗位有所不同。', sensitivity_level: 'low' },
      { id: 'KB-002', category: '公司介绍', applicable_positions: ['all'], question_variants: ['公司规模', '公司多少人', '公司介绍', '你们是做什么的'], standard_answer: '我们是一家 **AI 驱动的企业服务公司**，成立于 2018 年：\n\n- **规模**：全国约 500+ 员工\n- **总部**：北京，在上海、深圳设有分部\n- **业务**：为企业提供智能化 HR 解决方案\n- **融资**：已完成 B 轮融资，累计融资 2 亿元\n- **客户**：服务 500+ 中大型企业客户\n\n我们倡导「工程师文化」，鼓励创新和快速迭代。', sensitivity_level: 'low' },
      { id: 'KB-003', category: '福利政策', applicable_positions: ['all'], question_variants: ['五险一金', '社保公积金', '福利有哪些', '有什么福利'], standard_answer: '我们提供完善的福利保障：\n\n- **社保公积金**：入职当月缴纳五险一金，公积金按 12% 缴纳\n- **带薪年假**：首年 5 天，随工龄递增\n- **商业保险**：补充医疗险、重疾险\n- **节日福利**：生日礼金、节日礼品\n- **健康保障**：年度体检\n- **学习补贴**：每年 5000 元培训预算\n- **零食下午茶**：免费零食饮料', sensitivity_level: 'low' },
      { id: 'KB-004', category: '入职流程', applicable_positions: ['all'], question_variants: ['入职需要什么材料', '报到带什么', '入职准备什么'], standard_answer: '入职前需要准备以下材料：\n\n1. **身份证** 原件及复印件 2 份\n2. **学历证书** 原件及复印件 1 份\n3. **离职证明**（如之前有工作）\n4. **一寸白底证件照** 3 张\n5. **银行卡**（工资卡）\n6. **体检报告**（三级医院出具，3个月内有效）\n\n报到时间通常为 **每月第一个工作日**，具体时间 HR 会提前通知。', sensitivity_level: 'low' },
      { id: 'KB-005', category: '办公环境', applicable_positions: ['all'], question_variants: ['办公地点', '在哪里上班', '公司地址', '加班多吗'], standard_answer: '**办公信息**：\n\n- **地址**：北京市海淀区中关村软件园二期\n- **交通**：地铁 13 号线知春路站，步行 10 分钟\n- **环境**：开放式办公区，独立会议室，休息区\n\n**工作时间**：\n- 弹性工作制（9:00-18:00 或 10:00-19:00）\n- 午休 1.5 小时\n- 加班需申请，可调休\n\n整体工作节奏适中，不强制加班，提倡高效工作。', sensitivity_level: 'low' },
      { id: 'KB-101', category: '技术要求', applicable_positions: ['技术岗'], question_variants: ['技术栈', '用什么技术', '技术要求', '需要掌握什么'], standard_answer: '**技术岗能力要求**：\n\n- **后端**：Python/Go/Java，熟悉微服务架构\n- **前端**：React/Vue，熟悉 TypeScript\n- **数据**：SQL、Python 数据处理\n- **工具**：Git、Docker、K8s\n- **加分项**：AI/ML 经验、大规模系统设计能力\n\n我们更看重 **工程能力** 和 **学习能力**，技术栈可以入职后学习。', sensitivity_level: 'low' },
      { id: 'KB-102', category: '技术面试', applicable_positions: ['技术岗'], question_variants: ['技术面考什么', '算法题吗', '面试内容', '怎么面试'], standard_answer: '**技术面试安排**：\n\n1. **第一轮（45分钟）**：\n   - 算法编程（LeetCode 中等难度）\n   - 基础八股文（数据结构、网络、操作系统）\n\n2. **第二轮（60分钟）**：\n   - 系统设计题（设计一个 XXX 系统）\n   - 项目深挖（您的项目经历）\n\n**准备建议**：\n- 重点复习：数组、链表、二叉树、动态规划\n- 准备 2-3 个有深度的项目经历\n- 系统设计：可参考《系统设计面试》', sensitivity_level: 'low' },
      { id: 'KB-103', category: '职业发展', applicable_positions: ['技术岗'], question_variants: ['晋升机制', '怎么晋升', '晋升路径', '成长空间'], standard_answer: '**技术岗发展路径**：\n\n```\nT2 (Senior) → T3 (Staff) → T4 (Principal) → T5 (Fellow)\n     ↓\n   M1 (Tech Lead) → M2 (Manager) → M3 (Director)\n```\n\n- **晋升周期**：每年 4 月评估一次\n- **晋升标准**：技术能力 + 业务影响 + 团队贡献\n- **培训资源**：内部技术分享、外部培训、Conference 参与\n- **导师制度**：入职指定 1:1 导师', sensitivity_level: 'low' },
      { id: 'KB-201', category: '薪资结构', applicable_positions: ['销售岗'], question_variants: ['提成怎么算', '销售薪资', '收入构成', '工资结构'], standard_answer: '**销售岗薪资结构**：\n\n- **base 底薪**：8K-15K（根据经验定级）\n- **绩效工资**：2K-5K/月\n- **提成**：签约合同额的 3%-8%\n- **奖金**：季度/年度奖金包\n\n**薪资范围**：\n- 初级销售：10-15K/月\n- 高级销售：20-40K/月\n- top sales：年薪可达 50-80 万\n\n具体 offer 会根据您的经验和对齐市场水平来定。', sensitivity_level: 'medium' },
      { id: 'KB-301', category: '日常工作', applicable_positions: ['运营岗'], question_variants: ['运营做什么', '日常工作', '岗位内容', '具体工作'], standard_answer: '**运营岗工作内容**：\n\n- **用户运营**：用户生命周期管理、活跃度分析、用户分层策略\n- **活动运营**：策划执行用户活动、活动效果复盘优化\n- **内容运营**：内容选题策划、社群内容管理\n- **数据运营**：核心指标监控、数据分析报告', sensitivity_level: 'low' },
      { id: 'KB-401', category: '团队配置', applicable_positions: ['管理岗'], question_variants: ['团队多少人', '汇报关系', '下属有几个', '团队规模'], standard_answer: '**管理岗团队配置**：\n\n- **团队规模**：\n  - Team Lead：3-5 人\n  - Manager：8-15 人\n  - Director：20-50 人\n\n- **汇报关系**：直接汇报给部门 VP\n- **支持资源**：1:1 HR BP 对接、内部猎头支持招聘、外部管理培训预算', sensitivity_level: 'low' }
    ];

    const sensitiveKeywords = ['薪资', '工资', '底薪', '提成能谈吗', '期权', '股权', '竞业协议', '背景调查', '离职证明', 'offer催一下', '能不能快点', '比较急', '你们面试官怎么样'];

    const emotionKeywords = {
      negative: ['不满', '太差', '失望', '投诉', '垃圾', '废物', '没用', '浪费时间', '黑心', '坑', '骗子'],
      urgent: ['急', '非常急', '马上', '立刻', '赶紧', '很急', '快', '快点'],
      questionIndicators: ['怎么', '如何', '为什么', '是不是', '能不能', '可以吗', '多少', '几轮', '什么', '哪']
    };
    
    // 人工参与必要性分析关键词
    const humanNecessityKeywords = {
      // 高必要性 - 涉及敏感信息
      sensitive: ['薪资', '工资', '底薪', '提成', '期权', '股权', '股票', '奖金', '年终奖', '报销', '赔偿', '违约金', '竞业协议', '保密协议', '背景调查', 'offer', '录用通知'],
      // 高必要性 - 涉及法律合规
      legal: ['合同', '劳动法', '仲裁', '起诉', '投诉', '举报', '维权', '工伤', '辞退', '裁员', '开除', '不续约'],
      // 高必要性 - 涉及个人情况
      personal: ['我', '我的', 'offer', '面试', '笔试', '背调', '谈薪', '沟通过'],
      // 中必要性 - 需要人工判断
      judgement: ['情况', '特殊', '可以', '能不能', '允许', '批准', '申请', '通融'],
      // 低必要性 - 一般咨询
      general: ['公司', '岗位', '职位', '福利', '假期', '五险一金', '面试流程', '入职', '报销']
    };
    
    // 问题复杂度分析
    const questionComplexityKeywords = {
      // 简单 - 一问一答
      simple: ['几轮', '多久', '多少', '在哪里', '什么时候', '谁', '什么时间'],
      // 中等 - 需要解释
      medium: ['为什么', '怎么', '如何', '流程', '规则', '制度', '政策'],
      // 复杂 - 需要综合判断
      complex: ['情况', '特殊', '能否', '申请', '通融', '例外', '帮忙', '问一下']
    };
    
    // 分析问题特征
    const analyzeQuestion = (query) => {
      const queryLower = query.toLowerCase();
      const analysis = {
        hasSensitive: false,
        hasLegal: false,
        hasPersonal: false,
        needsJudgement: false,
        hasEmotionNegative: false,
        hasEmotionUrgent: false,
        complexity: 'simple', // simple, medium, complex
        isQuestion: false,
        intentCategory: 'general', // general, sensitive, legal, personal, complaint
        suggestion: '',
        humanNecessityScore: 0, // 0-100
        humanNecessityLevel: 'low', // low, medium, high, urgent
        reason: []
      };
      
      // 检测敏感词
      for (const keyword of humanNecessityKeywords.sensitive) {
        if (queryLower.includes(keyword)) {
          analysis.hasSensitive = true;
          analysis.intentCategory = 'sensitive';
          analysis.humanNecessityScore += 35;
          analysis.reason.push('涉及薪资/福利等敏感信息');
          break;
        }
      }
      
      // 检测法律相关
      for (const keyword of humanNecessityKeywords.legal) {
        if (queryLower.includes(keyword)) {
          analysis.hasLegal = true;
          analysis.intentCategory = 'legal';
          analysis.humanNecessityScore += 40;
          analysis.reason.push('涉及法律合规问题');
          break;
        }
      }
      
      // 检测个人情况
      for (const keyword of humanNecessityKeywords.personal) {
        if (queryLower.includes(keyword)) {
          analysis.hasPersonal = true;
          if (analysis.intentCategory === 'general') analysis.intentCategory = 'personal';
          analysis.humanNecessityScore += 20;
          analysis.reason.push('涉及个人具体情况');
          break;
        }
      }
      
      // 检测需要判断
      for (const keyword of humanNecessityKeywords.judgement) {
        if (queryLower.includes(keyword)) {
          analysis.needsJudgement = true;
          analysis.complexity = 'complex';
          analysis.humanNecessityScore += 15;
          analysis.reason.push('需要人工综合判断');
          break;
        }
      }
      
      // 检测负面情绪
      for (const keyword of emotionKeywords.negative) {
        if (queryLower.includes(keyword)) {
          analysis.hasEmotionNegative = true;
          analysis.humanNecessityScore += 15;
          analysis.reason.push('检测到负面情绪');
          break;
        }
      }
      
      // 检测紧急程度
      for (const keyword of emotionKeywords.urgent) {
        if (queryLower.includes(keyword)) {
          analysis.hasEmotionUrgent = true;
          analysis.humanNecessityScore += 10;
          analysis.reason.push('用户表达紧急需求');
          break;
        }
      }
      
      // 分析问题复杂度
      for (const keyword of questionComplexityKeywords.complex) {
        if (queryLower.includes(keyword)) {
          analysis.complexity = 'complex';
          break;
        }
      }
      for (const keyword of questionComplexityKeywords.medium) {
        if (queryLower.includes(keyword)) {
          if (analysis.complexity === 'simple') analysis.complexity = 'medium';
          break;
        }
      }
      
      // 检测问句
      for (const keyword of emotionKeywords.questionIndicators) {
        if (queryLower.includes(keyword)) {
          analysis.isQuestion = true;
          break;
        }
      }
      
      // 判断意图类别
      if (analysis.hasEmotionNegative && !analysis.hasSensitive && !analysis.hasLegal) {
        analysis.intentCategory = 'complaint';
      }
      
      // 生成建议
      if (analysis.hasLegal) {
        analysis.suggestion = '建议转人工处理，涉及法律合规问题需专业解答';
      } else if (analysis.hasSensitive) {
        analysis.suggestion = '建议转人工处理，涉及敏感信息需HR确认';
      } else if (analysis.hasEmotionNegative) {
        analysis.suggestion = '建议优先转人工，疏导用户情绪并解决问题';
      } else if (analysis.needsJudgement || analysis.hasPersonal) {
        analysis.suggestion = '建议转人工，需根据具体情况判断';
      } else if (analysis.hasEmotionUrgent) {
        analysis.suggestion = '建议优先响应，可先AI回复再跟进人工确认';
      } else {
        analysis.suggestion = '可由AI先回复，如用户不满意再转人工';
      }
      
      // 确定人工必要性等级
      if (analysis.humanNecessityScore >= 70 || analysis.hasLegal) {
        analysis.humanNecessityLevel = 'urgent';
        analysis.humanNecessityScore = Math.min(100, analysis.humanNecessityScore);
      } else if (analysis.humanNecessityScore >= 50) {
        analysis.humanNecessityLevel = 'high';
      } else if (analysis.humanNecessityScore >= 25) {
        analysis.humanNecessityLevel = 'medium';
      } else {
        analysis.humanNecessityLevel = 'low';
      }
      
      return analysis;
    };

    const quickQuestions = {
      all: [
        { id: 'q1', text: '面试有几轮？', icon: 'calendar' },
        { id: 'q2', text: '五险一金怎么缴？', icon: 'shield' },
        { id: 'q3', text: '入职需要什么材料？', icon: 'file-text' },
        { id: 'q4', text: '公司地址在哪里？', icon: 'map-pin' },
      ],
      '技术岗': [
        { id: 't1', text: '技术栈要求？', icon: 'code' },
        { id: 't2', text: '技术面试考什么？', icon: 'terminal' },
        { id: 't3', text: '晋升路径？', icon: 'trending-up' },
      ],
      '销售岗': [
        { id: 's1', text: '提成怎么算？', icon: 'dollar-sign' },
        { id: 's2', text: '客户资源怎么分配？', icon: 'users' },
      ],
      '运营岗': [
        { id: 'o1', text: '日常工作内容？', icon: 'layout' },
        { id: 'o2', text: 'KPI怎么考核？', icon: 'target' },
      ],
      '管理岗': [
        { id: 'm1', text: '团队规模多大？', icon: 'users' },
        { id: 'm2', text: '权限有哪些？', icon: 'lock' },
      ]
    };

    // 生成近30天模拟数据
    const generateDailyMetrics = () => {
      const data = [];
      const today = new Date();
      for (let i = 29; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        const baseLine = 75 + (30 - i) * 0.3;
        const variance = Math.random() * 10 - 5;
        const aiResolved = Math.min(95, Math.max(60, baseLine + variance));
        const totalConversations = Math.floor(30 + Math.random() * 20);
        data.push({
          date: dateStr,
          total_conversations: totalConversations,
          ai_resolved: Math.floor(totalConversations * (aiResolved / 100)),
          human_handled: totalConversations - Math.floor(totalConversations * (aiResolved / 100)),
          ai_resolution_rate: parseFloat(aiResolved.toFixed(1)),
          avg_response_time: Math.floor(20 + Math.random() * 20),
          satisfaction_score: parseFloat((4.0 + Math.random() * 1).toFixed(2)),
          sensitive_blocked: Math.floor(Math.random() * 5)
        });
      }
      return data;
    };
    
    // ==================== 通知渠道配置 ====================
    const NOTIFICATION_CHANNELS = [
      { id: 'wechat', name: '企业微信', icon: 'wechat', color: 'green', description: '通过企业微信应用推送通知' },
      { id: 'dingtalk', name: '钉钉', icon: 'dingtalk', color: 'blue', description: '通过钉钉机器人推送通知' },
      { id: 'feishu', name: '飞书', icon: 'feishu', color: 'blue', description: '通过飞书机器人推送通知' },
      { id: 'email', name: '邮件', icon: 'email', color: 'gray', description: '通过邮件发送通知' },
      { id: 'webhook', name: '自定义 Webhook', icon: 'webhook', color: 'purple', description: '通过自定义 Webhook URL 推送' }
    ];
    
    // 通知触发规则配置
    const NOTIFICATION_RULES = [
      { id: 'urgent', name: '紧急问题', level: 'urgent', score: 70, description: '人工必要性 ≥ 70分' },
      { id: 'high', name: '高优先级', level: 'high', score: 50, description: '人工必要性 ≥ 50分' },
      { id: 'sensitive', name: '敏感信息', level: 'sensitive', score: 0, description: '涉及敏感关键词' },
      { id: 'emotion', name: '情绪异常', level: 'emotion', score: 0, description: '检测到负面/紧急情绪' }
    ];
    
    // 加载通知配置
    const loadNotificationConfig = () => {
      try {
        const saved = localStorage.getItem('hr-notification-config');
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {}
      return {
        enabled: true,
        channels: [], // 已启用的渠道ID列表
        rules: ['urgent', 'high', 'sensitive'], // 触发的规则
        webhookUrl: '',       // 自定义 Webhook URL
        wechatWebhookUrl: '', // 企业微信机器人 Webhook URL
        dingtalkWebhookUrl: '', // 钉钉机器人 Webhook URL
        feishuWebhookUrl: '',  // 飞书机器人 Webhook URL
        emailAddress: 'hr@company.com',
        notifyOnKnowledgeBaseMiss: true // 知识库无匹配时通知
      };
    };
    
    // 保存通知配置
    const saveNotificationConfig = (config) => {
      try {
        localStorage.setItem('hr-notification-config', JSON.stringify(config));
      } catch (e) {}
    };
    
    // ==================== 发送通知（真实实现）====================
    const sendNotification = async (config, item) => {
      const results = [];
      const levelText = item.humanNecessityLevel === 'urgent' ? '🚨 紧急' : item.humanNecessityLevel === 'high' ? '⚠️ 高优先级' : '📋 待处理';
      const levelCN = item.humanNecessityLevel === 'urgent' ? '紧急' : item.humanNecessityLevel === 'high' ? '高' : '中';
      
      // 管理员通知内容（含完整问题分析与评分）
      const adminText = `【HR智能助手】新问题需处理 - ${levelText}\n\n❓ 问题：${item.question}\n📂 应聘岗位：${item.position}\n📊 紧急程度：${item.humanNecessityScore || '-'}分（${levelCN}）\n🔍 分析：${item.context || '知识库无匹配，需人工解答'}\n⏰ 时间：${item.created_at}\n🔗 处理链接：${window.location.href}`;
      
      for (const channelId of config.channels) {
        const channel = NOTIFICATION_CHANNELS.find(c => c.id === channelId);
        if (!channel) continue;
        
        try {
          if (channelId === 'email') {
            // 邮件：通过 Formsubmit API 直接发送（无需注册，无需 Key，只填邮箱）
            // 首次发送时收件人会收到一封激活确认邮件，点击一次后永久激活
            const emailTo = config.emailAddress || '';
            if (!emailTo) {
              results.push({ channel: channel.name, status: 'warn', message: '未填写收件邮箱' });
              continue;
            }
            try {
              const resp = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(emailTo)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                  _subject: `【HR助手】新问题待处理 - ${levelText} | ${item.question.substring(0, 20)}...`,
                  _template: 'table',
                  _captcha: 'false',
                  message: adminText,
                  from: 'HR AI 智能助手'
                })
              });
              const data = await resp.json();
              if (data.success === 'true' || data.success === true) {
                results.push({ channel: channel.name, status: 'success', message: `邮件已发送至 ${emailTo}` });
              } else {
                results.push({ channel: channel.name, status: 'error', message: `发送失败：${data.message || JSON.stringify(data)}` });
              }
            } catch (fetchErr) {
              results.push({ channel: channel.name, status: 'error', message: `发送异常：${fetchErr.message}` });
            }
            
          } else if (['wechat', 'dingtalk', 'feishu'].includes(channelId)) {
            // 企业微信 / 钉钉 / 飞书：通过各自的机器人 Webhook 发送
            const webhookUrl = config[channelId + 'WebhookUrl'] || '';
            if (!webhookUrl) {
              results.push({ channel: channel.name, status: 'warn', message: '未配置 Webhook URL，跳过发送' });
              continue;
            }
            
            let payload;
            if (channelId === 'wechat') {
              // 企业微信机器人消息格式
              payload = { msgtype: 'text', text: { content: adminText } };
            } else if (channelId === 'dingtalk') {
              // 钉钉机器人消息格式
              payload = { msgtype: 'text', text: { content: adminText }, at: { isAtAll: false } };
            } else if (channelId === 'feishu') {
              // 飞书机器人消息格式
              payload = { msg_type: 'text', content: { text: adminText } };
            }
            
            try {
              const resp = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (resp.ok) {
                results.push({ channel: channel.name, status: 'success', message: '消息已发送' });
              } else {
                results.push({ channel: channel.name, status: 'error', message: `发送失败 (HTTP ${resp.status})` });
              }
            } catch (fetchErr) {
              // 跨域或网络错误（常见于本地 Demo）
              results.push({ channel: channel.name, status: 'error', message: `网络错误：${fetchErr.message}（可能存在跨域限制，建议通过后端代理发送）` });
            }
            
          } else if (channelId === 'webhook') {
            // 自定义 Webhook
            const webhookUrl = config.webhookUrl || '';
            if (!webhookUrl) {
              results.push({ channel: channel.name, status: 'warn', message: '未填写 Webhook URL' });
              continue;
            }
            const payload = {
              title: `【HR助手】新问题待处理 - ${levelCN}`,
              question: item.question,
              position: item.position,
              score: item.humanNecessityScore,
              level: item.humanNecessityLevel,
              analysis: item.context,
              time: item.created_at,
              url: window.location.href
            };
            try {
              const resp = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (resp.ok) {
                results.push({ channel: channel.name, status: 'success', message: 'Webhook 已响应' });
              } else {
                results.push({ channel: channel.name, status: 'error', message: `Webhook 响应异常 (HTTP ${resp.status})` });
              }
            } catch (fetchErr) {
              results.push({ channel: channel.name, status: 'error', message: `发送失败：${fetchErr.message}` });
            }
          }
        } catch (e) {
          results.push({ channel: channel.name, status: 'error', message: '处理异常：' + e.message });
        }
      }
      
      return results;
    };

    // ==================== 存储层 ====================
    const STORAGE_KEY = 'hr-ai-assistant-data';

    const defaultData = {
      conversations: [],
      reviewQueue: [],
      humanSessions: [],  // 人工会话记录
      knowledgeBase: [...knowledgeBase],
      operationLogs: [],

        totalConversations: 0,
        aiResolved: 0,
        humanHandled: 0,
        sensitiveBlocked: 0,
        totalSatisfaction: 0,
        satisfactionCount: 0,
        totalHumanAnswerTime: 0  // 员工实际答疑总时长（分钟）
      }
    };

    const loadData = () => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return { ...defaultData, ...parsed };
        }
      } catch (e) {}
      return { ...defaultData };
    };

    const saveData = (data) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    };

    // ==================== 图标组件 ====================

    // ==================== 管理员账号配置 ====================
    const getAdminPassword = () => localStorage.getItem('hr-admin-password') || 'admin123';
    const ADMIN_CREDENTIALS = {
      username: 'admin',
      getPassword: getAdminPassword
    };

    // ==================== 登录组件 ====================
    function LoginModal({ onLogin, onClose }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [showPassword, setShowPassword] = useState(false);
      
      // 检查是否是首次登录
      const isFirstLogin = !localStorage.getItem('hr-admin-password');

      const handleSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        setTimeout(() => {
          if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.getPassword()) {
            sessionStorage.setItem('hr-admin-logged-in', 'true');
            localStorage.setItem('hr-admin-username', username);
            // 如果是首次登录且未设置过密码，设置默认密码到localStorage
            if (!localStorage.getItem('hr-admin-password')) {
              localStorage.setItem('hr-admin-password', 'admin123');
            }
            onLogin(username);
          } else {
            setError('用户名或密码错误，请重试');
          }
          setLoading(false);
        }, 500);
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden animate-slide-up">
            <div className="bg-gradient-to-r from-blue-600 to-blue-700 p-6 text-white text-center">
              <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3">
                <Icon name="lock" className="w-8 h-8" />
              </div>
              <h2 className="text-xl font-bold">管理员登录</h2>
              <p className="text-blue-100 text-sm mt-1">
                {isFirstLogin ? '首次登录，请使用默认账号密码' : '请输入管理员账号访问后台'}
              </p>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">用户名</label>
                <input
                  type="text"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="请输入用户名"
                  required
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">密码</label>
                <div className="relative">
                  <input
                    type={showPassword ? 'text' : 'password'}
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10"
                    placeholder="请输入密码"
                    required
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                  >
                    <Icon name={showPassword ? 'eyeOff' : 'eye'} className="w-5 h-5" />
                  </button>
                </div>
              </div>
              {error && (
                <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm flex items-center gap-2">
                  <Icon name="alert" className="w-4 h-4" />
                  {error}
                </div>
              )}
              <div className="flex gap-3 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 px-4 py-2.5 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors"
                >
                  取消
                </button>
                <button
                  type="submit"
                  disabled={loading}
                  className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 transition-colors flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <>
                      <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                      验证中...
                    </>
                  ) : '登录'}
                </button>
              </div>
              <div className={`text-center text-xs mt-4 p-3 rounded-lg ${isFirstLogin ? 'bg-amber-50 text-amber-700' : 'text-slate-400'}`}>
                {isFirstLogin ? (
                  <div className="flex items-center gap-2 justify-center">
                    <Icon name="alert" className="w-4 h-4" />
                    <span>首次登录：账号 <strong>admin</strong> / 密码 <strong>admin123</strong></span>
                  </div>
                ) : (
                  <span>默认账号：admin / {ADMIN_CREDENTIALS.getPassword() === 'admin123' ? 'admin123' : '已修改'}</span>
                )}
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==================== 修改密码组件 ====================
    function ChangePasswordModal({ onClose }) {
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [success, setSuccess] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');

        if (currentPassword !== ADMIN_CREDENTIALS.getPassword()) {
          setError('当前密码错误');
          return;
        }

        if (newPassword.length < 6) {
          setError('新密码长度不能少于6位');
          return;
        }

        if (newPassword !== confirmPassword) {
          setError('两次输入的新密码不一致');
          return;
        }

        setLoading(true);
        setTimeout(() => {
          localStorage.setItem('hr-admin-password', newPassword);
          setSuccess(true);
          setLoading(false);
          setTimeout(onClose, 1500);
        }, 500);

                <Icon name="lock" className="w-8 h-8" />
              </div>
              <h2 className="text-xl font-bold">修改密码</h2>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              {success ? (
                <div className="text-center py-4">
                  <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <Icon name="check" className="w-8 h-8 text-green-600" />
                  </div>
                  <p className="text-green-600 font-medium">密码修改成功！</p>
                </div>
              ) : (
                <>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">当前密码</label>
                    <input
                      type="password"
                      value={currentPassword}
                      onChange={(e) => setCurrentPassword(e.target.value)}

                      placeholder="请输入当前密码"

                    <label className="block text-sm font-medium text-slate-700 mb-1">新密码</label>
                    <input

                      placeholder="请输入新密码（至少6位）"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">确认新密码</label>
                    <input
                      type="password"
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="请再次输入新密码"
                      required
                    />

                    <div className="p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm">
                      {error}

                  <div className="flex gap-3 pt-2">
                    <button
                      type="button"
                      onClick={onClose}

                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      disabled={loading}

                    >
                      {loading ? '修改中...' : '确认修改'}

                </>
              )}
            </form>
          </div>
        </div>
      );
    }

    // ==================== 主应用 ====================

                      <div className="border-t border-slate-100 my-2"></div>
                      <button
                        onClick={() => setShowPasswordModal(true)}
                        className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm text-slate-500 hover:bg-blue-50 hover:text-blue-600 transition-all"

                      <button

                    />
                  )}
                  {adminSection === 'notification' && (
                    <NotificationPanel 
                      addLog={addLog}
                    />
                  )}
                  {adminSection === 'human' && (
                    <HumanConversationsPanel

          {showLoginModal && (

    // ==================== 候选人端 ====================
    function CandidatePortal({ appData, updateAppData }) {
      const [selectedPosition, setSelectedPosition] = useState('技术岗');
      const [messages, setMessages] = useState([
        { id: '1', role: 'assistant', content: '您好！我是 HR 智能助手 👋\n\n我可以帮您解答：\n• 面试流程相关问题\n• 薪资福利政策\n• 入职准备事项\n• 岗位信息咨询\n\n请先选择您的应聘岗位，然后告诉我您想了解什么？', timestamp: new Date() }
      ]);
      const [inputValue, setInputValue] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      // 人工服务模式状态
      const [isHumanMode, setIsHumanMode] = useState(false);
      const [currentSessionId, setCurrentSessionId] = useState(() => localStorage.getItem('lastHumanSessionId'));
      const [humanMessages, setHumanMessages] = useState([]);  // 存储人工会话消息
      const [showPositionSelect, setShowPositionSelect] = useState(true);
      const [showRating, setShowRating] = useState(false);
      const [confidenceThreshold, setConfidenceThreshold] = useState(() => appData.settings?.confidenceThreshold || 70);
      const messagesEndRef = useRef(null);
      
      // 监听 appData.settings 变化，更新本地阈值
      useEffect(() => {
        if (appData.settings?.confidenceThreshold) {
          setConfidenceThreshold(appData.settings.confidenceThreshold);
        }
      }, [appData.settings]);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, humanMessages]);

      // 刷新后检测进行中的人工会话（仅在首次加载时运行）
      useEffect(() => {
        // 延迟 100ms 确保 appData 已从 localStorage 恢复
        const timer = setTimeout(() => {
          if (appData.humanSessions?.length > 0 && currentSessionId) {
            // 检查当前 sessionId 对应的会话是否还在进行中
            const session = appData.humanSessions.find(s => s.id === currentSessionId && (s.status === 'pending' || s.status === 'replied'));
            if (session) {
              // 有进行中的会话，让用户在初始界面选择是否继续
              // 不自动进入人工模式
              setIsHumanMode(false);
            }
          }
        }, 100);
        
        return () => clearTimeout(timer);
        // 注意：不监听 currentSessionId 变化，避免干扰用户主动进入人工模式的操作
      }, []);

      // 当 HR 回复时，更新本地消息显示
      useEffect(() => {
        if (isHumanMode && currentSessionId) {
          const session = appData.humanSessions?.find(s => s.id === currentSessionId);
          if (session) {
            const userMsgs = session.messages?.filter(m => m.role === 'user') || [];
            setHumanMessages(userMsgs);
          }
        }
      }, [appData.humanSessions]);

      // 转人工处理
      const handleTransferToHuman = () => {
        const sessionId = 'HS-' + Date.now();
        
        // 构建转人工的审核队列条目
        const reviewItem = {
          id: 'RQ-' + Date.now(),
          question: selectedPosition ? `【${selectedPosition}】转人工请求` : '转人工请求',
          context: '用户主动请求转人工服务',
          position: selectedPosition || '未选择岗位',
          confidence: 100,
          status: 'pending',
          created_at: new Date().toLocaleString('zh-CN'),
          humanNecessityScore: 100,
          humanNecessityLevel: 'urgent',
          intentCategory: '转人工',
          suggestion: '请及时联系用户处理',
          emotions: {
            negative: false,
            urgent: false
          }
        };
        
        // 创建人工会话记录
        const humanConversation = {
          id: sessionId,
          position: selectedPosition || '未选择岗位',
          messages: [],
          status: 'pending',  // pending | replied | closed
          created_at: new Date().toLocaleString('zh-CN'),
          replied_at: null,
          closed_at: null
        };
        
        updateAppData(prev => ({
          ...prev,
          conversations: [...(prev.conversations || []), {
            id: Date.now().toString(),
            time: new Date().toLocaleString('zh-CN'),
            question: '转人工',
            answer: '已为您接通 HR 专员',
            aiResolved: false,
            confidence: 100,
            category: '转人工',
            satisfaction: null,
            sessionId: sessionId
          }].slice(-200),
          humanSessions: [...(prev.humanSessions || []), humanConversation],
          reviewQueue: [...prev.reviewQueue, reviewItem],
          stats: { 
            ...prev.stats, 
            totalConversations: prev.stats.totalConversations + 1,
            humanHandled: prev.stats.humanHandled + 1,
            totalHumanAnswerTime: prev.stats.totalHumanAnswerTime + 8  // 每次人工答疑估算8分钟
          }
        }));
        
        // 进入人工模式
        setIsHumanMode(true);
        setCurrentSessionId(sessionId);
        localStorage.setItem('lastHumanSessionId', sessionId);  // 持久化会话ID
        setHumanMessages([]);
        
        // 发送转人工通知
        const notifyConfig = loadNotificationConfig();
        if (notifyConfig.enabled && notifyConfig.channels.length > 0) {
          sendNotification({
            title: '🔔 有人请求转人工服务',
            content: `用户选择了【${selectedPosition || '未选择岗位'}】并请求转人工服务，请及时处理。`,
            type: 'urgent',
            channels: notifyConfig.channels,
            config: notifyConfig
          });
        }
      };

      const searchKnowledgeBase = (query, confidenceThreshold = 70) => {
        const queryLower = query.toLowerCase();

        // 先进行问题分析（用于人工必要性评分）
        const questionAnalysis = analyzeQuestion(query);

        for (const keyword of sensitiveKeywords) {
          if (queryLower.includes(keyword)) {
            return { 
              type: 'sensitive', 
              answer: '您好，该问题由 HR 专员为您专项解答，已为您安排转接，请稍候片刻 💬',
              confidence: 50,
              questionAnalysis
            };
          }
        }

        let bestMatch = null;
        let bestScore = 0;
        let matchedWords = []; // 记录匹配的关键词
        
        // 使用 appData 中的知识库（支持后台新增/编辑）
        const activeKnowledgeBase = appData.knowledgeBase || knowledgeBase;
        
        for (const item of activeKnowledgeBase) {
          if (item.applicable_positions[0] !== 'all' && !item.applicable_positions.includes(selectedPosition)) continue;

          for (const variant of item.question_variants) {
            let score = 0;
            const variantLower = variant.toLowerCase();
            const queryWords = queryLower.split(/\s+/);
            const currentMatchedWords = [];

            for (const word of queryWords) {
              if (variantLower.includes(word) || queryLower.includes(word)) {
                score += 10;
                currentMatchedWords.push(word);
              }
            }
            
            // 完整包含查询短语
            if (variantLower.includes(queryLower) || queryLower.includes(variantLower)) {
              score += 30;
            }
            
            // 如果是多字词组匹配，加更多分
            if (queryWords.length > 1) {
              // 多字词组中匹配到一半以上
              const halfMatch = currentMatchedWords.filter(w => variantLower.includes(w)).length;
              if (halfMatch >= queryWords.length * 0.5) {
                score += 15;
              }
            }

            if (score > bestScore) {
              bestScore = score;
              bestMatch = item;
              matchedWords = currentMatchedWords;
            }
          }
        }

        // 更严格的匹配判断：需要匹配分数 >= 25 且至少匹配了查询的50%或包含完整短语
        const queryWordsCount = queryLower.split(/\s+/).length;
        const matchRatio = matchedWords.length / Math.max(1, queryWordsCount);
        
        // 检查是否完整短语匹配（查询包含知识库词条，或词条包含查询）
        const isExactMatch = bestMatch?.question_variants.some(v => 
          queryLower.includes(v.toLowerCase()) || v.toLowerCase().includes(queryLower)
        );

        if (bestMatch && (isExactMatch || (bestScore >= 25 && matchRatio >= 0.5))) {
          const confidence = Math.min(95, bestScore + 60);
          return { 
            type: confidence < confidenceThreshold ? 'low_confidence' : 'success', 
            answer: bestMatch.standard_answer, 
            confidence, 
            category: bestMatch.category,
            questionAnalysis
          };
        }

        // 无匹配时，直接标记为需要人工处理（知识库没有的都要人工）
        // 基于问题分析增强评分
        const finalScore = Math.max(questionAnalysis.humanNecessityScore, 60); // 无匹配至少60分
        const finalLevel = finalScore >= 70 ? 'urgent' : finalScore >= 50 ? 'high' : 'medium';

        // 候选人端只展示简洁友好提示，不暴露技术评分细节
        const answerContent = `感谢您的提问 🙏\n\n您咨询的问题已由 HR 专员接手处理，我们会尽快为您回复，请稍候片刻。\n\n如有紧急需要，也可直接联系：hr@company.com`;

        return { 
          type: 'no_match', 
          answer: answerContent,
          confidence: 30,
          // 详细分析只存入 metadata，供管理员后台使用，不展示给候选人
          questionAnalysis: {
            ...questionAnalysis,
            humanNecessityScore: finalScore,
            humanNecessityLevel: finalLevel,
            fromKnowledgeBase: false // 标记为知识库无匹配
          }
        };
      };

      const handleSend = () => {
        if (!inputValue.trim()) return;

        // 人工模式：发送留言给HR
        if (isHumanMode && currentSessionId) {
          const userMessage = { 
            id: Date.now().toString(), 
            role: 'user', 
            content: inputValue, 
            timestamp: new Date().toLocaleString('zh-CN') 
          };
          
          // 添加到本地人工消息
          setHumanMessages(prev => [...prev, userMessage]);
          setInputValue('');
          
          // 保存到全局人工会话
          updateAppData(prev => {
            const sessions = prev.humanSessions || [];
            const sessionIndex = sessions.findIndex(s => s.id === currentSessionId);
            if (sessionIndex !== -1) {
              sessions[sessionIndex].messages = [...(sessions[sessionIndex].messages || []), userMessage];
              sessions[sessionIndex].lastMessage = inputValue;
              sessions[sessionIndex].lastMessageTime = new Date().toLocaleString('zh-CN');
            }
            return { ...prev, humanSessions: [...sessions] };
          });
          
          return;
        }

        // 检测"转人工"
        if (inputValue.includes('转人工')) {
          const userMessage = { id: Date.now().toString(), role: 'user', content: inputValue, timestamp: new Date() };
          setMessages(prev => [...prev, userMessage]);
          setInputValue('');
          updateAppData(prev => ({
            ...prev,
            stats: { ...prev.stats, humanHandled: prev.stats.humanHandled + 1 }
          }));
          return;
        }

        const userMessage = { id: Date.now().toString(), role: 'user', content: inputValue, timestamp: new Date() };
        setMessages(prev => [...prev, userMessage]);
        setInputValue('');
        setIsTyping(true);

        setTimeout(() => {
          const result = searchKnowledgeBase(inputValue, confidenceThreshold);
          let aiContent = result.answer;
          let needsHuman = result.type === 'no_match' || result.type === 'sensitive' || result.type === 'low_confidence';
          
          // 获取问题分析结果
          const questionAnalysis = result.questionAnalysis || { humanNecessityScore: 30, humanNecessityLevel: 'low', reason: [] };

          if (result.type === 'low_confidence') {
            aiContent += '\n\n⚠️ 系统已标记此答案为低置信度，将由 HR 审核后确认。';
          }

          const aiMessage = {
            id: (Date.now() + 1).toString(),
            role: 'assistant',
            content: aiContent,
            timestamp: new Date(),
            metadata: { 
              confidence: result.confidence, 
              category: result.category || '未分类', 
              needs_human: needsHuman,
              humanNecessityScore: questionAnalysis.humanNecessityScore,
              humanNecessityLevel: questionAnalysis.humanNecessityLevel,
              intentCategory: questionAnalysis.intentCategory
            }
          };

          setMessages(prev => [...prev, aiMessage]);
          setIsTyping(false);

          // 更新统计数据 & 保存对话记录
          updateAppData(prev => ({
            ...prev,
            conversations: [...(prev.conversations || []), {
              id: Date.now().toString(),
              time: new Date().toLocaleString('zh-CN'),
              question: userMessage,
              answer: aiContent,
              aiResolved: !needsHuman,
              confidence: result.confidence || 0,
              category: result.category || '未分类',
              satisfaction: null,
              responseTime: 0
            }].slice(-200),
            stats: {
              ...prev.stats,
              totalConversations: prev.stats.totalConversations + 1,
              aiResolved: needsHuman ? prev.stats.aiResolved : prev.stats.aiResolved + 1,
              humanHandled: needsHuman ? prev.stats.humanHandled + 1 : prev.stats.humanHandled,
              sensitiveBlocked: result.type === 'sensitive' ? prev.stats.sensitiveBlocked + 1 : prev.stats.sensitiveBlocked
            }
          }));

          // 如果是无匹配、低置信度或高人工必要性，添加到审核队列并发送通知
          if (needsHuman || questionAnalysis.humanNecessityLevel === 'urgent' || questionAnalysis.humanNecessityLevel === 'high') {
            const newItem = {
              id: 'RQ-' + Date.now(),
              question: inputValue,
              context: questionAnalysis.reason.join('、') || '用户提问',
              position: selectedPosition,
              confidence: result.confidence,
              status: 'pending',
              created_at: new Date().toLocaleString('zh-CN'),
              humanNecessityScore: questionAnalysis.humanNecessityScore,
              humanNecessityLevel: questionAnalysis.humanNecessityLevel,
              intentCategory: questionAnalysis.intentCategory,
              suggestion: questionAnalysis.suggestion,
              emotions: {
                negative: questionAnalysis.hasEmotionNegative,
                urgent: questionAnalysis.hasEmotionUrgent
              }
            };
            
            updateAppData(prev => ({
              ...prev,
              reviewQueue: [...prev.reviewQueue, newItem]
            }));
            
            // 自动发送通知
            const notifyConfig = loadNotificationConfig();
            if (notifyConfig.enabled && notifyConfig.channels.length > 0) {
              // 检查是否满足触发规则
              const shouldNotify = (
                (notifyConfig.rules.includes('urgent') && questionAnalysis.humanNecessityLevel === 'urgent') ||
                (notifyConfig.rules.includes('high') && questionAnalysis.humanNecessityLevel === 'high') ||
                (notifyConfig.rules.includes('sensitive') && result.type === 'sensitive') ||
                (notifyConfig.rules.includes('emotion') && (questionAnalysis.hasEmotionNegative || questionAnalysis.hasEmotionUrgent)) ||
                (notifyConfig.notifyOnKnowledgeBaseMiss && result.type === 'no_match')
              );
              
              if (shouldNotify) {
                // 异步发送通知（不阻塞UI）
                sendNotification(notifyConfig, newItem).then(results => {
                  console.log('[通知] 发送结果:', results);
                }).catch(err => {
                  console.error('[通知] 发送失败:', err);
                });
              }
            }
          }

          // 对话2轮后显示评价
          if (messages.length >= 4) {
            setShowRating(true);
          }
        }, 800 + Math.random() * 500);
      };

      const handleRating = (rating) => {
        updateAppData(prev => {
          const label = rating === 5 ? '满意' : rating === 3 ? '一般' : '不满';
          const convs = prev.conversations || [];
          const lastConv = convs[convs.length - 1];
          return {
            ...prev,
            conversations: lastConv
              ? convs.map((c, i) => i === convs.length - 1 ? { ...c, satisfaction: label } : c)
              : convs,
            stats: {
              ...prev.stats,
              totalSatisfaction: prev.stats.totalSatisfaction + rating,
              satisfactionCount: prev.stats.satisfactionCount + 1
            }
          };
        });
        setShowRating(false);
      };

      const questions = [...quickQuestions.all, ...(quickQuestions[selectedPosition] || [])];

      // 获取当前会话的HR回复
      const currentSession = appData.humanSessions?.find(s => s.id === currentSessionId);
      const hrReplies = currentSession?.messages?.filter(m => m.role === 'hr') || [];

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="lg:col-span-2">
            <div className="bg-white rounded-xl shadow-sm border h-[500px] md:h-[600px] flex flex-col">
              {showPositionSelect && (
                <div className="p-4 border-b bg-blue-50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                      <Icon name="bot" className="w-5 h-5 text-blue-600" />
                    </div>
                    <div>
                      <p className="text-sm text-slate-600">您正在咨询：</p>
                      <select value={selectedPosition} onChange={(e) => setSelectedPosition(e.target.value)} className="text-blue-600 font-medium bg-transparent border-none focus:outline-none">
                        <option value="技术岗">技术岗</option>
                          <option value="销售岗">销售岗</option>
                          <option value="运营岗">运营岗</option>
                          <option value="管理岗">管理岗</option>
                      </select>
                    </div>
                  </div>
                </div>
              )}


              {/* 人工模式顶部提示 */}
              {isHumanMode && (
                <div className="p-3 border-b bg-amber-50 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center">
                      <Icon name="user" className="w-4 h-4 text-amber-600" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-amber-800">人工服务模式</p>
                      <p className="text-xs text-amber-600">您的留言将发送给 HR 同事</p>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => {
                        // 退出人工模式，保留会话ID和消息记录
                        setIsHumanMode(false);
                        setHumanMessages([]);
                      }} 
                      className="px-3 py-1.5 text-sm text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition-colors"
                    >
                      返回
                    </button>
                    <button 
                      onClick={() => {
                        // 开始新对话，清除所有状态
                        setIsHumanMode(false);
                        setCurrentSessionId(null);
                        localStorage.removeItem('lastHumanSessionId');
                        setHumanMessages([]);
                        setMessages([]);
                      }} 
                      className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg transition-colors text-sm font-medium"
                    >
                      开始新对话
                    </button>
                  </div>
                </div>
              )}

              {/* 继续会话通知（固定在聊天区域上方） */}
              {!isHumanMode && currentSessionId && appData.humanSessions?.find(s => s.id === currentSessionId && (s.status === 'pending' || s.status === 'replied')) && (
                <div className="px-4 py-3 bg-gradient-to-r from-amber-50 to-orange-50 border-b border-amber-200">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center">
                        <Icon name="message" className="w-5 h-5 text-amber-600" />
                      </div>
                      <div>
                        <p className="text-sm font-medium text-amber-800">您有人工会话待处理</p>
                        {hrReplies.length > 0 ? (
                          <p className="text-xs text-amber-600">HR 已回复您的留言</p>
                        ) : (
                          <p className="text-xs text-amber-600">您可以继续留言，HR同事会在人工窗口回复您</p>
                        )}
                      </div>
                    </div>
                    <button 
                      onClick={() => {
                        const session = appData.humanSessions?.find(s => s.id === currentSessionId);
                        const userMsgs = session?.messages?.filter(m => m.role === 'user') || [];
                        setIsHumanMode(true);
                        setHumanMessages(userMsgs);
                      }}
                      className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg transition-colors text-sm font-medium shadow-sm"
                    >
                      继续会话
                    </button>
                  </div>
                </div>
              )}

              <div className="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll">
                {/* AI对话消息（人工模式前的内容） */}
                {!isHumanMode && messages.map(message => (
                  <MessageBubble key={message.id} message={message} onTransferHuman={handleTransferToHuman} />
                ))}
                
                {/* 人工模式消息区域 */}
                {isHumanMode && (
                  <>
                    {/* 问题-答案交替显示 */}
                    {(() => {
                      // 合并所有消息并按时间排序
                      const allMessages = [];
                      
                      // 添加 HR 的回复
                      currentSession?.messages?.filter(m => m.role === 'hr').forEach(msg => {
                        allMessages.push({ ...msg, type: 'hr' });
                      });
                      
                      // 添加候选人的留言
                      humanMessages.forEach(msg => {
                        allMessages.push({ ...msg, type: 'user' });
                      });
                      
                      // 按时间排序
                      allMessages.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                      
                      if (allMessages.length === 0) return null;
                      
                      return allMessages.map((msg, idx) => {
                        if (msg.type === 'hr') {
                          // HR 回复（绿色气泡，右侧）
                          return (
                            <div key={msg.id || `hr-${idx}`} className="flex gap-3 animate-slide-up">
                              <div className="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
                                <Icon name="user" className="w-4 h-4 text-green-600" />
                              </div>
                              <div className="bg-green-50 rounded-2xl rounded-tl-sm px-4 py-3 border border-green-200 max-w-[80%]">
                                <p className="text-sm text-slate-700 whitespace-pre-wrap">{msg.content}</p>
                                <p className="text-xs text-slate-400 mt-1">{msg.timestamp}</p>
                              </div>
                            </div>
                          );
                        } else {
                          // 候选人留言（蓝色气泡，左侧）
                          return (
                            <div key={msg.id || `user-${idx}`} className="flex gap-3 animate-slide-up flex-row-reverse">
                              <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
                                <Icon name="user" className="w-4 h-4 text-blue-600" />
                              </div>
                              <div className="bg-blue-500 text-white rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%]">
                                <p className="text-sm whitespace-pre-wrap">{msg.content}</p>
                                <p className="text-xs text-blue-200 mt-1">{msg.timestamp}</p>
                              </div>
                            </div>
                          );
                        }
                      });
                    })()}
                    
                    {/* 无消息提示 */}
                    {(!currentSession?.messages?.filter(m => m.role === 'hr').length && !humanMessages.length) && (
                      <div className="text-center py-8">
                        <div className="w-16 h-16 rounded-full bg-amber-100 flex items-center justify-center mx-auto mb-4">
                          <Icon name="message" className="w-8 h-8 text-amber-600" />
                        </div>
                        <p className="text-slate-600">请在下方输入您的问题</p>
                        <p className="text-sm text-slate-400">您可以继续留言,HR同事会在人工窗口回复您</p>
                      </div>
                    )}
                  </>
                )}
                
                {isTyping && (
                  <div className="flex gap-3 animate-fade-in">
                    <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
                      <Icon name="bot" className="w-4 h-4 text-blue-600" />
                    </div>
                    <div className="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border">
                      <div className="flex gap-1">
                        <div className="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style={{ animationDelay: '0ms' }}></div>
                        <div className="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style={{ animationDelay: '150ms' }}></div>
                        <div className="w-2 h-2 rounded-full bg-slate-400 animate-bounce" style={{ animationDelay: '300ms' }}></div>
                      </div>
                    </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              {showRating && (
                <div className="p-4 border-t bg-amber-50 flex items-center justify-center gap-4">
                  <span className="text-sm text-slate-600">评价一下回答：</span>
                  <button onClick={() => handleRating(5)} className="p-2 hover:bg-green-100 rounded-full transition-colors"><Icon name="thumbsUp" className="w-6 h-6 text-green-600" /></button>
                  <button onClick={() => handleRating(3)} className="p-2 hover:bg-yellow-100 rounded-full transition-colors"><Icon name="star" className="w-6 h-6 text-yellow-500" /></button>
                  <button onClick={() => handleRating(1)} className="p-2 hover:bg-red-100 rounded-full transition-colors"><Icon name="thumbsDown" className="w-6 h-6 text-red-600" /></button>
                </div>
              )}

              <div className="p-4 border-t bg-slate-50">
                <div className="flex gap-2">
                  <input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} placeholder={isHumanMode ? "给 HR 留言..." : "输入您的问题..."} className="flex-1 px-4 py-2.5 rounded-lg border bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" />
                  <button onClick={handleSend} disabled={!inputValue.trim()} className={`px-4 py-2.5 rounded-lg hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-colors ${isHumanMode ? 'bg-green-600 text-white' : 'bg-blue-600 text-white'}`}>
                    <Icon name="send" className="w-4 h-4" />
                  </button>
                  {!isHumanMode && (
                    <button onClick={handleTransferToHuman} className="px-4 py-2.5 bg-amber-500 text-white rounded-lg hover:bg-amber-600 transition-colors flex items-center gap-2" title="转人工服务">
                      <Icon name="user" className="w-4 h-4" />
                      <span className="hidden sm:inline text-sm">转人工</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* 右侧面板 */}
          <div className="lg:col-span-1">
            {/* AI模式：显示快捷问题 */}
            {!isHumanMode && (
              <div className="bg-white rounded-xl shadow-sm border h-[500px] md:h-[600px] flex flex-col">
                <div className="p-4 border-b">
                  <h3 className="font-semibold text-slate-800">快捷问题</h3>
                  <p className="text-sm text-slate-500">点击直接获取答案</p>
                </div>
                <div className="flex-1 overflow-y-auto p-4">
                  <div className="space-y-2">
                    {questions.map((q, idx) => (
                      <button key={q.id || idx} onClick={() => { setInputValue(q.text); setTimeout(handleSend, 100); }} className="w-full text-left px-4 py-3 rounded-lg bg-slate-50 hover:bg-blue-50 hover:text-blue-700 transition-all flex items-center gap-3 group">
                        <Icon name={q.icon || 'message'} className="w-4 h-4 text-blue-500" />
                        <span className="text-sm">{q.text}</span>
                        <Icon name="arrowRight" className="w-4 h-4 ml-auto opacity-0 group-hover:opacity-100 transition-opacity" />
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
            
            {/* 人工模式：显示会话状态 */}
            {isHumanMode && (
              <div className="bg-white rounded-xl shadow-sm border h-[500px] md:h-[600px] flex flex-col">
                <div className="p-4 border-b bg-amber-50">
                  <h3 className="font-semibold text-slate-800">💬 会话状态</h3>
                  <p className="text-sm text-slate-500">HR 同事正在处理中</p>
                </div>
                <div className="flex-1 overflow-y-auto p-4">
                  <div className="space-y-4">
                    <div className="p-3 bg-blue-50 rounded-lg">
                      <p className="text-xs text-blue-600 mb-1">应聘岗位</p>
                      <p className="text-sm font-medium text-slate-700">{selectedPosition}</p>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-lg">
                      <p className="text-xs text-slate-500 mb-1">会话ID</p>
                      <p className="text-sm font-mono text-slate-600">{currentSessionId}</p>
                    </div>
                    <div className="p-3 bg-green-50 rounded-lg">
                      <p className="text-xs text-green-600 mb-1">您的留言数</p>
                      <p className="text-2xl font-bold text-green-600">{humanMessages.length}</p>
                    </div>
                    <div className="p-3 bg-amber-50 rounded-lg">
                      <p className="text-xs text-amber-600 mb-1">HR 回复数</p>
                      <p className="text-2xl font-bold text-amber-600">{currentSession?.messages?.filter(m => m.role === 'hr').length || 0}</p>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-lg">
                      <p className="text-xs text-slate-500 mb-1">会话状态</p>
                      <span className={`inline-block px-2 py-1 rounded text-xs font-medium ${currentSession?.status === 'replied' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                        {currentSession?.status === 'replied' ? '已回复' : '待回复'}
                      </span>
                    </div>
                  </div>
                  
                  <div className="mt-6 p-4 bg-amber-50 rounded-lg">
                    <p className="text-sm text-amber-800 font-medium mb-2">💡 温馨提示</p>
                    <p className="text-xs text-amber-600">HR 同事会尽快查看您的留言并回复。请保持页面开启，或稍后刷新查看回复。</p>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function MessageBubble({ message, onTransferHuman }) {
      const isUser = message.role === 'user';
      const isNeedsHuman = message.metadata?.needs_human && message.role === 'assistant';
      
      // 人工必要性等级对应的样式
      const getHumanNecessityStyle = (level) => {
        switch (level) {
          case 'urgent': return { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-600', badge: 'bg-red-500' };
          case 'high': return { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-600', badge: 'bg-amber-500' };
          case 'medium': return { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-600', badge: 'bg-blue-500' };
          default: return { bg: 'bg-green-50', border: 'border-green-200', text: 'text-green-600', badge: 'bg-green-500' };
        }
      };
      
      const necessityStyle = message.metadata?.humanNecessityLevel ? getHumanNecessityStyle(message.metadata.humanNecessityLevel) : null;

      return (
        <div className={`flex gap-3 animate-slide-up ${isUser ? 'flex-row-reverse' : ''}`}>
          {!isUser && (
            <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
              <Icon name="bot" className="w-4 h-4 text-blue-600" />
            </div>
          )}
          <div className={`max-w-[80%] ${isUser ? 'items-end' : 'items-start'} flex flex-col gap-1`}>
            <div className={`px-4 py-3 rounded-2xl ${
              isUser
                ? 'bg-blue-500 text-white rounded-tr-sm'
                : isNeedsHuman && message.metadata?.category !== '转人工'
                  ? 'bg-amber-50 border border-amber-200 rounded-tl-sm'
                  : isNeedsHuman
                    ? 'bg-green-50 border border-green-200 rounded-tl-sm'
                    : 'bg-white rounded-tl-sm shadow-sm border'
            }`}>
              <p className="text-sm whitespace-pre-wrap leading-relaxed">{message.content}</p>
            </div>
            {!isUser && (
              <div className="flex items-center gap-2 px-1 flex-wrap">
                {/* 仅对知识库命中的正常回复显示置信度，转人工/无匹配不展示技术指标 */}
                {message.metadata?.confidence && !isNeedsHuman && (
                  <span className={`text-xs ${message.metadata.confidence >= 70 ? 'text-green-600' : 'text-amber-600'}`}>
                    置信度 {message.metadata.confidence}%
                  </span>
                )}
                {message.metadata?.category && !isNeedsHuman && (
                  <><span className="text-slate-300">•</span><span className="text-xs text-slate-500">{message.metadata.category}</span></>
                )}
              </div>
            )}
            {/* 转人工按钮 - 仅当候选人主动点击"转人工"按钮前的AI回复且已标记为需要人工时显示（提供再次确认入口）*/}
            {isNeedsHuman && onTransferHuman && message.metadata?.category !== '转人工' && (
              <div className="mt-2">
                <button 
                  onClick={onTransferHuman} 
                  className="px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white text-sm font-medium rounded-lg hover:from-amber-600 hover:to-orange-600 transition-all shadow-md hover:shadow-lg flex items-center gap-2"
                >
                  <Icon name="user" className="w-4 h-4" />
                  已转人工，点击确认
                </button>
              </div>
            )}
          </div>
          {isUser && (
            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-500 flex items-center justify-center flex-shrink-0 text-white text-sm font-medium">你</div>
          )}
        </div>
      );
    }

    // ==================== HR 管理后台 ====================
    function HRAdmin({ appData, updateAppData, addLog }) {
      const [activeSection, setActiveSection] = useState('knowledge-base');
      const [sidebarOpen, setSidebarOpen] = useState(true);

      return (
        <div className="flex flex-col lg:flex-row gap-6">
          {/* 移动端菜单按钮 */}
          <button onClick={() => setSidebarOpen(!sidebarOpen)} className="lg:hidden p-2 bg-white rounded-lg border">
            <Icon name={sidebarOpen ? 'x' : 'menu'} className="w-5 h-5" />
          </button>

          {/* 侧边栏 */}
          <div className={`${sidebarOpen ? 'block' : 'hidden'} lg:block w-full lg:w-64 flex-shrink-0`}>
            <div className="bg-white rounded-xl shadow-sm border">
              <div className="p-4 border-b">
                <h3 className="font-semibold text-slate-800">管理功能</h3>
              </div>
              <nav className="p-2">
                {[
                  { id: 'knowledge-base', label: '知识库管理', icon: 'database', badge: appData.knowledgeBase.length },
                  { id: 'review-queue', label: '审核队列', icon: 'clock', badge: appData.reviewQueue.length },
                  { id: 'operation-logs', label: '操作日志', icon: 'activity' },
                  { id: 'settings', label: '系统设置', icon: 'settings' }
                ].map(section => (

            {activeSection === 'review-queue' && <ReviewQueuePanel appData={appData} updateAppData={updateAppData} addLog={addLog} />}
            {activeSection === 'operation-logs' && <OperationLogsPanel appData={appData} />}
            {activeSection === 'settings' && <SettingsPanel appData={appData} updateAppData={updateAppData} addLog={addLog} />}

    function KnowledgeBasePanel({ appData, updateAppData, addLog }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('');
      const [filterSensitivity, setFilterSensitivity] = useState('');
      const [editingItem, setEditingItem] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);

      const categories = [...new Set(appData.knowledgeBase.map(k => k.category))];

      const filteredItems = appData.knowledgeBase.filter(item => {
        const matchSearch = !searchTerm || item.question_variants.some(q => q.includes(searchTerm)) || item.category.includes(searchTerm);
        const matchCategory = !filterCategory || item.category === filterCategory;
        const matchSensitivity = !filterSensitivity || item.sensitivity_level === filterSensitivity;
        return matchSearch && matchCategory && matchSensitivity;
      });

      const handleDelete = (id) => {
        if (confirm('确定删除这条知识库条目？')) {
          updateAppData(prev => ({ ...prev, knowledgeBase: prev.knowledgeBase.filter(k => k.id !== id) }));
          addLog('删除知识库', `删除了 ${id}`);

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div>
              <h2 className="text-lg font-semibold text-slate-800">知识库管理</h2>
              <p className="text-sm text-slate-500">管理 FAQ 问答知识库（{filteredItems.length} 条）</p>
            </div>
            <button onClick={() => setShowAddModal(true)} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2 text-sm">
              <Icon name="plus" className="w-4 h-4" /> 新增条目
            </button>
          </div>

          <div className="bg-white rounded-xl shadow-sm border p-4">
            <div className="flex flex-wrap gap-3">
              <div className="relative flex-1 min-w-[200px]">
                <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="搜索问题..." className="w-full pl-10 pr-4 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="px-3 py-2 rounded-lg border text-sm">
                <option value="">全部分类</option>
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={filterSensitivity} onChange={(e) => setFilterSensitivity(e.target.value)} className="px-3 py-2 rounded-lg border text-sm">
                <option value="">全部敏感级</option>
                <option value="low">低敏感</option>
                <option value="medium">中敏感</option>
                <option value="high">高敏感</option>

                  <tr>
                    <th className="text-left px-4 py-3 text-sm font-medium text-slate-600">ID</th>
                    <th className="text-left px-4 py-3 text-sm font-medium text-slate-600">分类</th>
                    <th className="text-left px-4 py-3 text-sm font-medium text-slate-600">问题</th>
                    <th className="text-left px-4 py-3 text-sm font-medium text-slate-600">敏感级</th>
                    <th className="text-left px-4 py-3 text-sm font-medium text-slate-600">操作</th>

                <tbody className="divide-y">

                    <tr key={item.id} className="hover:bg-slate-50">

                      <td className="px-4 py-3 text-sm text-slate-600 max-w-xs truncate">{item.question_variants[0]}</td>
                      <td className="px-4 py-3"><span className={`px-2 py-0.5 rounded-full text-xs ${item.sensitivity_level === 'low' ? 'bg-green-50 text-green-600' : item.sensitivity_level === 'medium' ? 'bg-yellow-50 text-yellow-600' : 'bg-red-50 text-red-600'}`}>{item.sensitivity_level === 'low' ? '低' : item.sensitivity_level === 'medium' ? '中' : '高'}</span></td>
                      <td className="px-4 py-3">

                        setEditingItem(null);

                      onCancel={() => setEditingItem(null)} 
                    />

                    <div className="space-y-4">
                      <div><label className="text-sm text-slate-500">ID</label><p className="font-mono text-sm">{editingItem.id}</p></div>
                      <div><label className="text-sm text-slate-500">分类</label><p>{editingItem.category}</p></div>
                      <div><label className="text-sm text-slate-500">适用岗位</label><p>{editingItem.applicable_positions.join(', ')}</p></div>
                      <div><label className="text-sm text-slate-500">问题变体</label><p>{editingItem.question_variants.join(' / ')}</p></div>
                      <div><label className="text-sm text-slate-500">标准答案</label><p className="whitespace-pre-wrap bg-slate-50 p-3 rounded-lg text-sm">{editingItem.standard_answer}</p></div>
                    </div>

                </div>
              </div>
            </div>

          {/* 新增弹窗 */}
          {showAddModal && <AddKnowledgeModal onClose={() => setShowAddModal(false)} appData={appData} onAdd={(item) => { updateAppData(prev => ({ ...prev, knowledgeBase: [...prev.knowledgeBase, item] })); addLog('新增知识库', `添加了 ${item.id}`); setShowAddModal(false); }} />}
        </div>
      );

    function AddKnowledgeModal({ onClose, onAdd, appData, initialQuestion = '' }) {
      const positions = ['all', '技术岗', '销售岗', '运营岗', '管理岗'];
      const [form, setForm] = useState({ category: '面试流程', question: initialQuestion, answer: '', sensitivity_level: 'low', applicable_positions: ['all'] });

      const handleSubmit = () => {
        if (!form.question || !form.answer) return;
        // 计算下一个ID：取现有最大ID号 +1
        const existingIds = appData.knowledgeBase.map(item => parseInt(item.id.replace('KB-', '')) || 0);
        const maxId = existingIds.length > 0 ? Math.max(...existingIds) : 0;
        const newId = 'KB-' + String(maxId + 1).padStart(3, '0');
        onAdd({ id: newId, category: form.category, applicable_positions: form.applicable_positions, question_variants: form.question.split('\n'), standard_answer: form.answer, sensitivity_level: form.sensitivity_level });
      };

      const togglePosition = (pos) => {
        if (pos === 'all') {
          setForm({ ...form, applicable_positions: ['all'] });
        } else {
          const current = form.applicable_positions.filter(p => p !== 'all');
          if (current.includes(pos)) {
            const newPos = current.filter(p => p !== pos);
            setForm({ ...form, applicable_positions: newPos.length === 0 ? ['all'] : newPos });
          } else {
            setForm({ ...form, applicable_positions: [...current, pos] });
          }

                  </select>

                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">适用岗位</label>

                            ? 'bg-blue-500 text-white'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'

                      >

                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">问题（每行一个）</label>
